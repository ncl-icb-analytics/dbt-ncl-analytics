[project]
name = "dbt-ncl-analytics"
version = "0.1.0"
description = "Python tooling for the WNL ICB analytics project. dbt runs on the Fusion engine (installed separately), not from this environment."
readme = "README.md"
requires-python = ">=3.11,<3.12"
# dbt itself is NOT a dependency here - it runs on the dbt Fusion engine, installed
# by start_dbt.ps1 / start_dbt.sh. These deps are only for the helper scripts in scripts/.
dependencies = [
    "dotenv==0.9.9",
    "keyring==25.6.0",
    "pandas==2.3.3",
    "pyyaml==6.0.2",
    "ruamel-yaml>=0.18.0",
    "snowflake-connector-python[pandas]==4.3.0",
]
