version: 2

seeds:
  - name: sus_apc_business_rules_sla
    description: |
      APC business rules and SLA contract classifications for admitted patient care spells.
      Contains 25 active business rules spanning elective, emergency, and non-elective pathways.
      Used to apply clinical and administrative categorization to spells in fct_sus_apc_monthly.
      Generated from legacy SUS data and SQL Server procedures; covers financial years 1314-1718.
    
    columns:
      - name: rule_id
        description: Unique business rule identifier (BR_APC_001 through BR_APC_025)
        data_tests:
          - unique
          - not_null
      
      - name: rule_name
        description: Descriptive name for the business rule
        data_tests:
          - not_null
      
      - name: rule_description
        description: Detailed explanation of the business rule and when it applies
      
      - name: rule_type
        description: Category of the rule (LENGTH_OF_STAY, CLINICAL_CATEGORY, ADMISSION_SOURCE, etc.)
        data_tests:
          - accepted_values:
              arguments:
                values: ['LENGTH_OF_STAY', 'CLINICAL_CATEGORY', 'ADMISSION_SOURCE', 'DISCHARGE_DESTINATION', 'PROCEDURE_FLAG', 'SPECIALIST_FLAG', 'PROCEDURE_TYPE', 'READMISSION_FLAG']
      
      - name: admission_type
        description: Admission classification the rule applies to (ELECTIVE, NON_ELECTIVE_EMERGENCY, NON_ELECTIVE_URGENT, etc.)
        data_tests:
          - accepted_values:
              arguments:
                values: ['ELECTIVE', 'NON_ELECTIVE_EMERGENCY', 'NON_ELECTIVE_URGENT', 'NON_ELECTIVE_TRANSFER', 'ALL']
      
      - name: los_threshold_min
        description: Minimum length of stay in days for this rule to apply (0 = any)
      
      - name: los_threshold_max
        description: Maximum length of stay in days for this rule to apply (9999 = unlimited)
      
      - name: hrg_category
        description: HRG category this rule applies to (ALL = applies to all HRGs)
        data_tests:
          - accepted_values:
              arguments:
                values: ['ALL', 'MENTAL_HEALTH', 'TRAUMA', 'MATERNITY', 'ONCOLOGY', 'REHABILITATION', 'PALLIATIVE', 'HIGH_COST', 'SPECIALIST', 'REGIONAL_SPECIALIST', 'DIAGNOSTIC', 'SURGICAL', 'MEDICAL']
      
      - name: effective_from
        description: Date from which the rule becomes active (financial year start)
        data_type: date
      
      - name: effective_to
        description: Date to which the rule remains active (financial year end)
        data_type: date
      
      - name: active
        description: Flag indicating if the rule is currently active (1 = active, 0 = deprecated)
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
      
      - name: contract_type
        description: SLA contract type classification produced when this rule matches
        data_tests:
          - not_null
