version: 2

seeds:
  - name: myria_eligibility_file_dates
    description: |
      RFL eligibility-file send dates for Project Myria. One row per monthly high-risk
      cohort sent to the Royal Free. Drives the eligible-patient set in
      int_myria_eligible_propensity_match: for each date the cohort is taken from the
      published snapshot as it stood on that day. Append a row each time a file is sent -
      no model change needed.
    config:
      column_types:
        file_date: date
        label: varchar(32)
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: file_date
        description: Date the high-risk cohort file was sent to RFL.
        data_tests:
          - unique
          - not_null
      - name: label
        description: Human-readable month label.
