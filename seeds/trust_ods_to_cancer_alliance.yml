version: 2

seeds:
  - name: trust_ods_to_cancer_alliance
    description: |
      Mapping of NHS Trust ODS codes to Cancer Alliance names and codes. Please check the source for the methodology used.
      Source: Fisher L, Speed V. Identifying the NHS Trusts within Cancer Alliances. Bennett Institute for Applied Data Science, University of Oxford. 2026. https://www.bennett.ox.ac.uk/blog/2026/04/identifying-the-nhs-trusts-within-cancer-alliances/ doi:10.53764/oph.4e5ieyekuv
    columns:
      - name: ods_code
        description: Provider code.
        tests:
          - not_null
          - unique
      - name: ods_name
        description: Provider name.
        tests:
          - not_null
      - name: cancer_alliance_name
        description: Name of the Cancer Alliance. Can be null if the trust is not part of a Cancer Alliance (typically a result of not delivering cancer care).
      - name: cancer_alliance_code
        description: Code of the Cancer Alliance (local code used in this mapping).
      - name: notes
        description: Optional notes about trust membership or mappings.
