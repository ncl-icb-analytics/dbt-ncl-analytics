version: 2

seeds:
  - name: qadmissions_townsend_lsoa_2011
    description: >
      Townsend Deprivation Score per UK Lower Layer Super Output Area (2011
      boundaries). Provides the `town` feature for the QAdmissions risk
      model, which was trained on Townsend specifically. IMD is not a
      substitute - the Cox coefficients depend on Townsend's component
      variables (unemployment, no-car ownership, non-owner-occupation,
      overcrowding).

      Coverage is UK-wide (England, Scotland, Wales, Northern Ireland).
      NCL patients use English LSOAs only; non-English rows are retained
      for portability. The downstream feature build bridges
      dim_person_demographics.lsoa_code_21 to the 2011 codes used here via
      seeds/lsoa_2011_to_2021.csv (the ONS LSOA 2011 to 2021 lookup).
    columns:
      - name: lsoa_2011_code
        description: 'LSOA 2011 code (e.g. E01029868). Trimmed of trailing whitespace from the source export.'
        data_tests:
          - unique
          - not_null
      - name: lsoa_2011_label
        description: 'LSOA 2011 human-readable label.'
      - name: townsend_score
        description: 'Townsend Deprivation Score. Higher values indicate greater deprivation. Observed UK range -7.03 to +13.31.'
        data_tests:
          - not_null
      - name: townsend_quintile
        description: 'UK-wide Townsend quintile (1 = least deprived, 5 = most deprived).'
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
