version: 2

seeds:
  - name: sus_op_business_rule_codes
    description: >-
      Reviewable values used by named outpatient business rules. SQL retains
      compound rule logic and precedence; this seed owns codes, match behaviour
      and effective periods.
    config: &sus_op_reference_config
      meta:
        owner:
          name: Commissioning Analytics
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - rule_name
              - attribute_name
              - code
              - match_type
              - include_or_exclude
              - effective_from
              - effective_to
      - dbt_utils.expression_is_true:
          arguments:
            expression: "effective_to is null or effective_from is null or effective_from <= effective_to"
    columns:
      - name: rule_name
        data_tests: [not_null]
      - name: attribute_name
        data_tests: [not_null]
      - name: code
        data_tests: [not_null]
      - name: match_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['EXACT', 'CONTAINS', 'PREFIX']
      - name: include_or_exclude
        data_tests:
          - accepted_values:
              arguments:
                values: ['INCLUDE', 'EXCLUDE']

  - name: sus_op_pod_mapping
    description: >-
      Reviewable HRG and specialty-group mapping used to derive outpatient POD
      level 4. SPECIALIST excludes specialty 560 and specialties 900-960;
      NON_SPECIALIST includes them; ALL applies regardless of specialty.
    config: *sus_op_reference_config
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - core_hrg
              - specialty_group
    columns:
      - name: core_hrg
        data_tests: [not_null]
      - name: specialty_group
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ALL', 'SPECIALIST', 'NON_SPECIALIST']
      - name: pod_level_4
        data_tests: [not_null]

  - name: sus_op_sensitive_terminology
    description: >-
      Reviewable ICD-10 and OPCS-4 terminology used to classify sensitive SUS
      outpatient activity. Priority preserves the legacy diagnosis-before-procedure
      evaluation order.
    config: *sus_op_reference_config
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - code_system
              - code
    columns:
      - name: code_system
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ICD10', 'OPCS4']
      - name: code
        data_tests: [not_null]
      - name: sensitive_category
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['HIV', 'STI', 'IVF']
      - name: priority
        data_tests: [not_null]
