version: 2

seeds:
  - name: sus_op_business_rules_sla
    description: >-
      Legacy commissioner/provider/financial-year SLA combinations used by the
      outpatient business-rule contract-type calculation.
    config:
      meta:
        owner:
          name: Commissioning Analytics
    columns:
      - name: commissioner_code
        data_tests:
          - not_null
      - name: provider_code
        data_tests:
          - not_null
      - name: financial_year
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - commissioner_code
              - provider_code
              - financial_year
