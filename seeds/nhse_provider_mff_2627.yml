version: 2
seeds:
  - name: nhse_provider_mff_2627
    description: |
      NHS England provider-level Market Forces Factor values, 2026/27.

      Grain: one row per provider organisation code (205 rows).

      Source: NHSE Non-Acute Collection Template v0.95, "MFF" tab
      ("Market Forces Factor 26/27").

      Used to adjust national indicative unit prices (see
      nhse_mh_bed_day_prices_2627) for local input-cost differences.
      Providers absent from the table (e.g. independent sector) default
      to a factor of 1.0 in downstream models.
    config:
      meta:
        owner:
          name: Eddie Davison
      column_types:
        provider_code: varchar(10)
        provider_name: varchar(120)
        mff_factor: float
    columns:
      - name: provider_code
        description: Provider organisation code (ODS). Primary key.
        data_tests:
          - not_null
          - unique
      - name: provider_name
        description: Provider name as published in the template.
        data_tests:
          - not_null
      - name: mff_factor
        description: Market Forces Factor multiplier for 2026/27 (1.0 to ~1.18).
        data_tests:
          - not_null
