version: 2

macros:
  - name: select_latest_mhsds_state
    description: >-
      Selects the newest reported state of each longitudinal MHSDS record from
      active submissions. Reporting period takes precedence over file receipt.
    arguments:
      - name: mhsds_table
        type: relation
        description: Relation containing uniq_submission_id, effective_from and the selection columns.
      - name: partition_cols
        type: list
        description: Non-empty list of columns defining the longitudinal record.
      - name: tie_breaker_cols
        type: list
        description: Descending source columns that make any remaining ties deterministic.

  - name: select_active_mhsds_records
    description: >-
      Retains every record from the accepted MHSDS submission for each reporting
      period. Use for activity that does not recur as changing state.
    arguments:
      - name: mhsds_table
        type: relation
        description: MHSDS relation containing uniq_submission_id.
