
macros:
  - name: temporal_join
    description: >
      Generates a temporal (point-in-time) join between a fact table and a slowly changing
      dimension. Matches each fact row to the dimension version whose validity window
      contains the fact date. Works with effective_start_date/effective_end_date dimensions
      (defaults) or dbt snapshots (pass valid_from_col/valid_to_col = dbt_valid_from/
      dbt_valid_to). Use join_type='inner' for an eligibility gate and 'left' for covariate
      enrichment.


    arguments:
      - name: fact_table
        type: string
        description: Fact table reference

      - name: fact_date_column
        type: string
        description: Date column in fact table to match against dimension validity

      - name: dimension_table
        type: string
        description: SCD dimension / snapshot table reference (validity columns named by valid_from_col / valid_to_col)

      - name: join_key
        type: string
        description: Column to join on. Default 'person_id'

      - name: join_type
        type: string
        description: >
          Join type. Default 'inner' (drop fact rows with no valid version -- eligibility
          gate). Use 'left' to keep every fact row -- covariate enrichment, coalesce
          defaults in the caller.

      - name: valid_from_col
        type: string
        description: Dimension valid-from column (inclusive). Default 'effective_start_date'; pass 'dbt_valid_from' for a dbt snapshot.

      - name: valid_to_col
        type: string
        description: Dimension valid-to column (exclusive; NULL = current). Default 'effective_end_date'; pass 'dbt_valid_to' for a dbt snapshot.
