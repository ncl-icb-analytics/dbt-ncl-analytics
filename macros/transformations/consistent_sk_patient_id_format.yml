macros:
  - name: consistent_sk_patient_id_format
    description: >
      Coerces a patient surrogate-key expression to VARCHAR. Use for all sk_patient_id
      columns in commissioning staging models so a future switch to numeric keys can
      be made in one place by updating this macro.

    arguments:
      - name: column
        type: string
        description: Column or SQL expression supplying the patient surrogate key
