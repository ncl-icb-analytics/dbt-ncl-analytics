# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: en-GB
tone_instructions: >-
  Be friendly, direct and constructive. Prioritise correctness, data quality,
  project architecture and clinical meaning. Explain impact. Mark polish as
  "nit:" and inherited concerns as "follow-up (non-blocking):". Keep scope
  proportional to the diff.
early_access: false

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_placeholder: "@coderabbitai summary"
  high_level_summary_instructions: >-
    Summarise changed model contracts, layer or dependency changes, downstream
    impact and validation. Distinguish new behaviour from inherited design.
    State whether a potential public-repository data-safety issue was found.
  poem: true
  review_status: true
  collapse_walkthrough: true
  sequence_diagrams: false
  changed_files_summary: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  suggested_reviewers: true
  auto_review:
    enabled: true
    drafts: true
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false

  path_filters:
    - "!target/**"
    - "!dbt_packages/**"
    - "!logs/**"

  path_instructions:
    # Public repository data safety
    - path: "**/*"
      instructions: |
        This is a public repository. Treat any change that appears to contain
        real patient- or person-level data, direct identifiers, or combinations
        of values that could identify a person as a critical blocking finding.
        Check seeds, test data, examples, logs, exports, screenshots, comments,
        documentation and hardcoded SQL values. Column names and clearly
        synthetic examples are not patient data by themselves. High-level
        aggregates such as broad counts, rates, distributions and validation
        totals are not person-level data and must not be flagged merely because
        they were calculated from patient data. Flag aggregates only when small
        cells or combined dimensions could expose an identifiable person. Do not
        repeat a suspected value in the review: identify only the file, location
        and data category. Ask the author to remove it and alert repository
        maintainers; deleting it from the latest diff alone may not remove public
        history.

    # Project-wide dbt conventions
    - path: "models/**/*.sql"
      instructions: |
        This is a public NHS dbt project on Snowflake. Review the project
        contract, not generic SQL style:

        - Treat folder, model name, SQL, YAML and tests as one contract.
        - Raw must never be consumed directly outside staging. Only models under
          models/staging may ref() raw_ models; everything else must start from
          staging or a later contract.
        - Beyond staging, choose dependencies by the contract needed rather than
          enforcing a rigid ladder. Modelling may reuse reporting models when
          they are the established interface and the dependency stays acyclic.
        - New or changed hand-written dependencies use ref(). Only generated raw
          models use source(). Flag newly introduced source() calls outside raw
          and hardcoded warehouse relations. Existing direct source() calls in
          staging are legacy debt: mention them as a non-blocking follow-up
          unless the change adds or depends on that bypass.
        - Check subject, population, reference time and grain. For each join,
          check whether it should be one-to-one, many-to-one or one-to-many. If
          the left-hand grain should survive, the right-hand input must have at
          most one row per join key; otherwise rows and counts are multiplied.
          If one-to-many is intended, require the new grain to be documented.
          Flag DISTINCT used after a join to hide duplication: it can discard
          real differences. When several right-hand rows should contribute to
          one result, prefer an intentional GROUP BY at the join key before the
          join. When one record should win, require a documented, deterministic
          selection rule. Otherwise change the model contract.
        - Prefer reuse or composition of an established model over a second
          definition of the same concept. A new parallel model must explain why
          the existing contract cannot be extended or composed.
        - Name models for their subject and grain, not the processing step that
          produced them. Treat names such as consolidated, enriched, processed,
          intermediate and final as warning signs unless they describe a real
          business concept or time/grain contract. Do not ask to rename an
          established model merely because an enhancement touches it.
        - Calibrate review depth to the change type. A new model puts its
          boundary, responsibility and name in scope. An enhancement to an
          existing model puts the addition and its effect on the existing
          contract in scope. An explicitly transitional legacy migration must
          still meet hard layer and correctness rules, but inherited internal
          design can be a non-blocking follow-up when faithful parity is the
          stated goal.
        - Flag confused responsibilities when one model combines concepts that
          have different grains, tests, owners, consumers or reasons to change.
          Suggest the boundary that would make those responsibilities clear.
          Do not equate one transformation or CTE with one model: cohesive steps
          that serve the same contract should stay together.
        - Prefer readable, straightforward SQL. Flag long, nested or repeated
          CASE statements when branching hides the business rule or makes it
          hard to test. A short local CASE is fine. Suggest a named model, CTE or
          lookup only when it makes the rule clearer. Logic must not masquerade
          as data: a seed may hold declarative facts or parameters, but business
          decisions and control flow must remain visible in SQL.
        - Review the changed behaviour and its effect on the existing contract.
          Do not ask a contributor enhancing an existing model to redesign
          unrelated pre-existing code. Raise existing design debt as blocking
          only when the change worsens it, depends on it, or cannot be safe
          without resolving it. It may still be mentioned when visible in the
          reviewed area and useful to future work: label it "follow-up
          (non-blocking):", keep it out of the merge recommendation, and do not
          search unrelated files for further debt.
        - Shared models may own definitions and terminology agreed for the whole
          project. Rules, terms, labels or classifications with programme-level
          authority must compose those shared models from the programme's folder
          or schema, with the programme visible in its established model-name
          family. Audience and product rules or vocabulary belong at their own
          downstream boundary.
        - Any narrower model that runs beside a shared contract—programme,
          geography, legacy migration or named consumer—must make that scope
          clear in its model name, folder/schema and description. Do not give a
          scoped variant an unqualified name that appears canonical.
        - Preserve unknown, false, not-applicable and missing-evidence states when
          the domain distinguishes them.
        - Clinical definitions, thresholds, code lists and date rules must be
          visible and checkable in the model contract.
        - When SQL, descriptions and tests disagree about business behaviour,
          identify the contradiction and ask which contract is authoritative.
          Do not prescribe a population-changing fix without evidence of the
          intended business rule.
        - Folder configuration in dbt_project.yml supplies database, schema,
          materialisation, tags and hooks. Request a model override only for a
          stated exception.

        From staging onward, every output column name must be unquoted
        snake_case except in published models. Flag quoted output aliases or
        identifiers elsewhere, including quotes used to preserve spaces, case
        or punctuation. Published models may use quoted consumer-facing names
        and do not need to remove those characters, but friendly names are
        optional and unquoted snake_case remains valid. Quoting a physical input
        identifier in generated raw SQL or a source declaration is also allowed.
        Follow established names: is_/has_ booleans; _date dates; _at
        timestamps; _id identifiers. Outside generated raw models, do not carry
        legacy derived names such as zcontracttype or z_contract_type into new
        project interfaces. Prefer the unprefixed business name when the derived
        value is canonical. Use dv_ when retaining both supplied and derived
        values makes their distinction useful, with the supplied value kept as a
        clearly named column or upstream source field. Existing SLAM and community
        dv_ families are established interfaces; do not request their redesign in
        an enhancement PR. Do not comment on whitespace, commas or line length.

    # Raw layer
    - path: "models/raw/**"
      instructions: |
        Raw models are generated 1:1 evidence from source tables. They may quote
        and rename physical columns to readable snake_case, but must not cast,
        filter, deduplicate, join or interpret rows. They use source() and start
        with raw_. Do not ask authors to edit generated output; flag manual edits
        and point fixes to source mappings, manual source YAML or the generator.

    # Staging layer
    - path: "models/staging/**"
      instructions: |
        Staging is the required boundary between raw and every downstream area.
        It provides one canonical project interface to a source object. New
        models and changed dependencies use ref() to a raw_ model, never source()
        or a hardcoded relation. Treat existing direct source() calls as legacy
        under the proportional-review rule. Select columns explicitly. Apply
        project names, types and universal source or delivery fixes while
        normally preserving the source entity, grain and legitimate rows.
        Staging should normally have no joins. Allow a join only when its sole
        purpose is universal source cleaning, standardisation or enrichment that
        every consumer should inherit; flag business populations and
        consumer-specific rules.
        Each source object should have one canonical staging interface. Reuse or
        extend an existing staging model for the same raw object rather than
        creating a pipeline-, consumer- or migration-named duplicate. Name a
        new model for the source object it cleans, using established project
        vocabulary rather than copying an opaque physical name. Models start
        with stg_. All output columns must have unquoted snake_case names. A base
        staging model plus an established _latest view for a cumulative
        resubmission feed is one source interface, not a duplicate.

    # Reference layer
    - path: "models/reference/**"
      instructions: |
        Reference models hold project-owned lookups and derived reference data
        shared across domains. They use staging-or-later inputs, not raw models
        or source(). Keep programme, audience and product rules out of this area.
        Follow neighbouring names and state the lookup grain and update basis.

    # Modelling layer
    - path: "models/modelling/**"
      instructions: |
        Modelling gives a purposeful transformation or shared domain rule a
        named, tested home. It must not reference raw_ models or source(). Models
        normally start with int_ and may join, filter or change grain. They may
        reuse reporting models where those provide the right established
        contract. Check that each model has one coherent responsibility, an
        explicit population, time and grain, and a reusable scope. One
        responsibility may contain several CTEs and transformations when they
        change for the same reason. Recommend a split only for independently
        changing concepts or contracts. Programme-specific logic belongs in its
        programme folder/schema and composes shared models without redefining
        them. Use int_ plus the established programme subject, for example
        int_flu_, int_smi_, int_myria_ or int_ltc_lcs_; inspect neighbouring
        names rather than inventing a new abbreviation. The folder alone is not
        enough if an unqualified model name would suggest project-wide scope.
        OLIDS schemas and governance messages are derived from folder
        configuration.

    # Reporting layer
    - path: "models/reporting/**"
      instructions: |
        Reporting is the marts layer: supported business entities and concepts
        for direct analysis. It must not reference raw_ models or source(). It
        may compose staging, modelling and reporting contracts as needed. Each
        model must state and test its population, reference time and grain.
        Useful width is allowed when joins preserve the core grain and reuse
        established definitions. Follow the existing dim_, fct_, pit_, obt_,
        dq_, def_ and programme naming families. def_ models describe shared
        indicator definitions and metadata; they are not a programme prefix.
        Programme scope remains visible in
        standard names such as fct_person_myria_, or in an established
        programme-owned reporting prefix such as cltcs_. Do not introduce a new
        programme prefix when the repository already has a family to follow.
        Disease registers use fct_person_{condition}_register and their
        established indicator metadata.

    # Published layer
    - path: "models/published/**"
      instructions: |
        Published models are governed contracts for named reports, dashboards,
        extracts or applications. Product selection, audience policy, legal
        basis and delivery naming belong here. Shared definitions must be reused
        from upstream rather than recreated for one product. Check direct_care
        and secondary_use placement, OLIDS opt-out or documented exemption, and
        the matching Snowflake governance tags. Follow an established product
        family such as the Myria _published models rather than renaming it to a
        generic product name. Published outputs may use quoted consumer-facing
        column names with spaces, case or punctuation. Do not require those
        characters to be removed, and do not require friendly names when
        snake_case already suits the consumer.

    # Partner products
    - path: "models/partner/**"
      instructions: |
        Partner models serve governed partner datasets and access mappings.
        Keep partner filtering and row-access policy at this boundary rather
        than changing shared reporting models. Partner-facing marts use the
        established ptr_ family and must retain the person key required by the
        configured row-access policy.

    # Semantic views
    - path: "models/semantic/**"
      instructions: |
        These are Snowflake Semantic Views, named sem_. Review facts, dimensions,
        metrics and joins against the contracts of their ref() inputs. The SQL is
        semantic-view DDL and has static analysis disabled; do not apply ordinary
        SELECT-model style rules.

    # Model properties
    - path: "models/**/*.y*ml"
      instructions: |
        Review model properties as contracts, not formatting:

        - Every model needs a description. It should state subject, population,
          reference time and grain where these apply.
        - New non-raw models require config.meta.owner.name.
        - New or changed test blocks use data_tests. Do not ask an enhancement
          PR to migrate an untouched legacy tests block.
        - Test the key or key combination that enforces grain.
        - Add accepted-value, not-null and relationship tests only when the
          documented domain contract makes them true.
        - Column descriptions should explain units, code systems, selection
          rules, dates, null meaning, derivation or non-obvious relationships;
          do not require prose that merely repeats a column name.
        - A semantic change must update SQL, descriptions and tests together.
        - auto_ source YAML is generated and must not be edited by hand.

    # Source registry and declarations
    - path: "scripts/sources/**"
      instructions: |
        This pipeline owns generated source YAML and raw models. Review mapping,
        naming, exclusions and manual-source handling for the intended source
        scope. Generated drift outside the requested source must be called out
        for deliberate inclusion, not assumed to be an author mistake.

    - path: "models/sources/**"
      instructions: |
        auto_ files are generated. Manual source declarations are the editable
        registry for opted-in tables and must match live identifiers and column
        types. Snowflake database, schema and identifiers are quoted.

    # Seeds
    - path: "seeds/**"
      instructions: |
        Seeds are small, team-owned reference data reviewed like code. They are
        not extracts, feeds or patient-level data. Check that CSV and YAML stay
        aligned and that thresholds, units, provenance and update rules are
        documented when they affect model logic. Seeds may hold lookup values,
        mappings, thresholds and numeric conversion parameters, but must not
        become a miniature DSL. Flag executable expressions, branching or
        precedence that requires a model or macro to interpret control flow.
        Logic must not masquerade as data: keep executable business rules in
        readable SQL and use seed rows only as declarative facts or parameters.
        Any seed that appears to contain real patient- or person-level data is a
        critical blocking finding under the repository-wide data-safety rule.

    # Macros
    - path: "macros/**"
      instructions: |
        Review the project behaviour the macro centralises, its callers and
        null/empty-input behaviour. Place new macros with neighbouring clinical,
        transformation, configuration, governance or utility macros. Require
        documentation for the macro contract and arguments, not a prose version
        of its implementation.

    # QOF register macros
    - path: "macros/qof_registers/**"
      instructions: |
        QOF register macros are named calculate_{condition}_register.sql and use
        shared observation and medication retrieval macros. Review inclusion,
        exclusion, age, reference-date and tie-breaking logic against the cited
        QOF rule. Keep enough dates, codes and flags for the result to be
        explainable.

    # Tests
    - path: "tests/**"
      instructions: |
        Singular tests return rows that violate a named model contract. Check
        that the test uses ref(), lives at the scope that owns the promise, and
        returns identifying or explanatory columns rather than only a count.
        Names and thresholds should make a production failure actionable.

chat:
  allow_non_org_members: false
  auto_reply: true

knowledge_base:
  opt_out: false
  code_guidelines:
    enabled: true
    filePatterns:
      - "PROJECT_CONVENTIONS.md"
  learnings:
    scope: local
    approval_delay: 3
  issues:
    scope: local
  pull_requests:
    scope: local
