name: Publish dbt artifacts
description: >
  Uploads target/manifest.json and target/run_results.json (gzipped) plus a
  meta.json sidecar to the DBT_ARTIFACTS stage. latest/manifest.json.gz is the
  state baseline for state:modified deploys and the source for
  ncl-semantic-layer-poc. Only call after a successful run - publishing a
  manifest for a failed deploy would make state:modified skip the failed
  models on the next run.

inputs:
  dbt-command:
    description: The dbt command that produced the artifacts (recorded in meta.json)
    required: true
  target:
    description: dbt target name, used as the stage path prefix
    required: false
    default: prod
  stage:
    description: Fully qualified internal stage
    required: false
    default: DATA_LAKE__NCL.DBT_OBSERVABILITY.STG_DBT_ARTIFACTS

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6
      with:
        version: "0.6.x"

    - name: Upload artifacts to stage
      shell: bash
      env:
        DBT_COMMAND: ${{ inputs.dbt-command }}
        DBT_TARGET: ${{ inputs.target }}
        ARTIFACT_STAGE: ${{ inputs.stage }}
      run: >
        uv run --with snowflake-connector-python
        python "${{ github.action_path }}/publish.py"
