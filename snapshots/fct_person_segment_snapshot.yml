snapshots:
  - name: fct_person_segment_snapshot
    relation: ref('fct_person_segment_snapshot_input')
    description: >-
      Prospective SCD2 history of person-level segment assignment, population
      flags and exposed segment criteria. One row represents one observed
      version for a person. dbt_valid_from and dbt_valid_to record when that
      version was observed by the pipeline; they do not reconstruct clinical
      state before the first snapshot run. Rows leaving the source are closed.
    config:
      strategy: check
      unique_key: [person_id]
      check_cols: all
      hard_deletes: invalidate
    columns:
      - name: person_id
        description: Person identifier and snapshot key.
        data_tests:
          - not_null

      - name: dbt_valid_from
        description: Time this observed version became active.
        data_tests:
          - not_null

      - name: dbt_valid_to
        description: Time this version was superseded or left the source; null if current.
