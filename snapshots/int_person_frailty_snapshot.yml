snapshots:
  - name: int_person_frailty_snapshot
    relation: ref('int_person_frailty')
    description: >
      SCD2 history of consolidated person frailty (AIC eFI2 score + band, Rockwood
      score + level/category, frailty-register severity + counts) so frailty
      trajectory can be tracked over time for control-cohort matching. `check_cols:
      all` — every column is a meaningful, deterministic frailty measure. Rows
      leaving the source are closed via `hard_deletes: invalidate`.

    config:
      strategy: check
      unique_key: [person_id]
      check_cols: all
      hard_deletes: invalidate

    columns:
      - name: person_id
        description: "Person identifier; snapshot unique_key."
        data_tests:
          - not_null

      - name: dbt_valid_from
        description: "When this snapshot version became active (SCD2)."
        data_tests:
          - not_null
