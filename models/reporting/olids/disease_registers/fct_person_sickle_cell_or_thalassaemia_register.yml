models:
  - name: fct_person_sickle_cell_or_thalassaemia_register
    description: 'Sickle cell or thalassaemia register for patients with a sickle cell disease or thalassaemia diagnosis.

      One row per person with SICKLE_COD or THAL_COD present (non-QOF).
      Includes has_sickle_cell and has_thalassaemia flags for the underlying condition(s).'

    tests:
      - dbt_utils.at_least_one:
          column_name: person_id

    config:
      meta:
        indicator:
          id: "SICKLE_THAL"
          type: "CONDITION"
          category: "LTC"
          clinical_domain: "Haematology"
          name_short: "Sickle Cell or Thalassaemia"
          description_short: "Sickle cell or thalassaemia register (non-QOF)"
          description_long: >
            Sickle cell or thalassaemia register using SICKLE_COD for sickle cell
            disease and THAL_COD for thalassaemia. A person is on the register if
            either condition is present; has_sickle_cell and has_thalassaemia flag
            which apply. Both are lifelong inherited haemoglobinopathies with no
            resolution codes or age restrictions.
          is_qof: false
          source_column: "is_on_register"
          sort_order: "COND_HAEM_SICKLE_THAL"
          usage_contexts:
            - "POPULATION_HEALTH_NEEDS_DASHBOARD"
          code_clusters:
            - cluster_id: "SICKLE_COD"
              category: "INCLUSION"
            - cluster_id: "THAL_COD"
              category: "INCLUSION"

        owner:
          name: Eddie Davison
    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - unique
          - not_null
