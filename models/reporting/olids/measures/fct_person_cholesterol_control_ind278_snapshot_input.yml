models:
  - name: fct_person_cholesterol_control_ind278_snapshot_input
    description: >
      Thin snapshot-input projection of fct_person_cholesterol_control_ind278: person,
      current practice, qualifying CVD registers, the selected LDL or non-HDL result and the
      IND278 outcome. Excludes reporting_date and measurement_period_start, which advance on
      every build, so the SCD2 snapshot versions only on genuine changes. Feeds
      fct_person_cholesterol_control_ind278_snapshot.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: person_id
        description: Person identifier; one row per person (snapshot unique_key).
        data_tests:
          - unique
          - not_null
      - name: current_practice_code
        description: ODS code of the current registration practice at the build.
      - name: has_chd
        description: Whether the person qualifies through the CHD register.
      - name: has_stroke_tia
        description: Whether the person qualifies through the stroke/TIA register.
      - name: has_pad
        description: Whether the person qualifies through the PAD register.
      - name: latest_lipid_observation_id
        description: Selected source observation; null when no result falls in the 12-month window.
      - name: latest_lipid_date
        description: Clinical date of the selected result; null when no result falls in the window.
      - name: lipid_type
        description: LDL cholesterol or Non-HDL cholesterol; null when no result falls in the window.
      - name: latest_lipid_value
        description: Selected result in mmol/L, without rounding.
      - name: is_lipid_recorded_in_last_12m
        description: Whether an LDL or non-HDL observation exists in the 12-month window at the build.
      - name: is_latest_lipid_valid
        description: Whether the selected result is assessable.
      - name: is_in_numerator
        description: Whether the selected result is valid and at or below its target.
      - name: indicator_status
        description: Achievement label at the build.
