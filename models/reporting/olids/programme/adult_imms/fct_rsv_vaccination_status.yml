models:
  - name: fct_rsv_vaccination_status
    description: 'Respiratory Syncytial Virus (RSV) vaccination programme status for
      people aged 75+ from 1st Sept 2024 or are currently aged 75-79 years for a catch-up
      campaign Single per person or newly eligible aged 80+ from 1st April 2026 - dose 1 status only.
      This table does not include RSV routine maternity vaccinations.'
    config:
      meta:
        owner:
          name: KateHomer55
    columns:
      - name: person_id
        description: 'Unique identifier for the person'
        data_tests:
          - not_null
          - unique

