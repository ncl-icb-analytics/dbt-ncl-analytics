models:
  - name: fct_person_segment_snapshot_input
    description: >-
      Stable person-level segmentation fields used by
      fct_person_segment_snapshot. One row represents one person in the current
      segmentation output. Age and general demographics are excluded so they
      do not create unrelated snapshot versions.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: person_id
        description: Person identifier and snapshot key.
        data_tests:
          - unique
          - not_null

      - name: segment_number
        description: Assigned segment, 1-8, with the highest eligible segment winning.

      - name: segment_name
        description: Assigned segment name.

      - name: is_active
        description: Currently registered in the scoped GP population.

      - name: is_deceased
        description: Person is recorded as deceased.

      - name: is_end_of_life
        description: Meets the End of Life cohort definition.

      - name: is_complex_adult
        description: Meets the Adults with Complexity cohort definition.

      - name: has_multiple_ltcs
        description: Adult with at least two qualifying LTCs.

      - name: has_single_ltc
        description: Adult with one qualifying LTC.

      - name: is_complex_child
        description: Meets at least one children with complexity criterion.

      - name: has_child_health_needs
        description: Child with at least one qualifying LTC.

      - name: ltc_count
        description: Count of qualifying segmentation LTC registers.

      - name: ltc_list
        description: Sorted array of qualifying condition codes.

      - name: adult_complexity_criteria_count
        description: Number of adult complexity criteria met.

      - name: child_complexity_criteria_count
        description: Number of child complexity criteria met.

      - name: child_has_2plus_ltcs
        description: Child has at least two qualifying LTCs.

      - name: child_has_complexity_diagnosis
        description: Child has a qualifying complexity diagnosis.

      - name: child_has_5plus_paediatric_op_appointments
        description: Child has at least five qualifying outpatient appointments.

      - name: child_has_2plus_outpatient_specialties
        description: Child has qualifying care across at least two specialties.

      - name: child_has_mh_inpatient_stay
        description: Child has a qualifying mental health inpatient stay.

      - name: child_has_7plus_community_contacts
        description: Child has at least seven qualifying community contacts.
