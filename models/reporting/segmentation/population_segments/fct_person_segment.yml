models:
  - name: fct_person_segment
    description: >
      Population segmentation for the ICB Strategy. One row per person in
      dim_person_demographics — everyone with registration history, including
      people who have left or died. Filter is_active = TRUE for the currently
      registered population.

      Every person is assigned to exactly one segment by hierarchy (highest
      wins): 8 End of Life (palliative care register, any age); 7 Adults with
      Complexity (>= 18, fct_person_complex_adults); 6 Adults with Multiple
      LTCs (>= 18, 2+ qualifying LTCs); 5 Adults with a Single LTC; 4 Mostly
      Healthy Adults; 3 Children with Complexity (< 18,
      int_segmentation_children_complexity); 2 Children with Health Needs
      (< 18, 1+ qualifying LTC); 1 Mostly Healthy Children.

      Qualifying LTCs for segments 6/5/2 are the 16 complex adults conditions
      plus NAFLD (int_segmentation_ltc_count); the complex adults cohort
      keeps its own list without NAFLD. The underlying cohorts are not
      mutually exclusive, so each is exposed as its own boolean alongside the
      exclusive segment assignment.

      The children with complexity LTC criterion is 2+ LTCs (not the
      circulated 1+), so a single LTC reads as health needs (segment 2)
      rather than complexity; with 1+, segment 2 was unreachable.
    data_tests:
      - dbt_utils.at_least_one:
          arguments:
            column_name: person_id
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('dim_person_demographics')
      # Adult segments imply age >= 18
      - dbt_utils.expression_is_true:
          name: adult_segments_are_adults
          arguments:
            expression: "segment_number NOT IN (4, 5, 6, 7) OR age >= 18"
      # Child segments imply age < 18
      - dbt_utils.expression_is_true:
          name: child_segments_are_children
          arguments:
            expression: "segment_number NOT IN (1, 2, 3) OR age < 18"
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: person_id
        description: Unique identifier for the person
        data_tests:
          - unique
          - not_null
      - name: sk_patient_id
        description: Pseudonymised patient key for joining to SUS/MHSDS/CSDS activity
      - name: is_active
        description: Currently registered with an NCL GP practice
      - name: is_deceased
        description: Person is recorded as deceased
      - name: age
        description: Current age (age at death for deceased persons)
      - name: segment_number
        description: Assigned segment, 1-8, mutually exclusive by hierarchy
          (highest wins)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5, 6, 7, 8]
                quote: false
      - name: segment_name
        description: Assigned segment name
        data_tests:
          - not_null
      - name: is_end_of_life
        description: Cohort flag - on the QOF palliative care register (segment 8)
      - name: is_complex_adult
        description: Cohort flag - in the complex adults cohort
          (fct_person_complex_adults, segment 7)
      - name: has_multiple_ltcs
        description: Cohort flag - aged >= 18 with 2+ qualifying LTCs (segment 6)
      - name: has_single_ltc
        description: Cohort flag - aged >= 18 with exactly 1 qualifying LTC
          (segment 5)
      - name: is_complex_child
        description: Cohort flag - aged < 18 meeting any children complexity
          criterion (segment 3)
      - name: has_child_health_needs
        description: Cohort flag - aged < 18 with 1+ qualifying LTC (segment 2)
      - name: ltc_count
        description: Count of qualifying LTC registers (16 complex adults
          conditions + NAFLD; LD at 65+ or under 18)
      - name: ltc_list
        description: Sorted array of qualifying condition codes
      - name: adult_complexity_criteria_count
        description: Complexity criteria met in the complex adults cohort
          (null if not in the cohort)
      - name: child_complexity_criteria_count
        description: Children complexity criteria met, 0-6 (null for adults)
      - name: child_has_2plus_ltcs
        description: Children criterion - 2+ qualifying LTCs (null for adults)
      - name: child_has_complexity_diagnosis
        description: Children criterion - 1+ coded complexity diagnosis.
          Always FALSE until the NWL code list populates the
          children_complexity_diagnosis_codes seed (null for adults).
      - name: child_has_5plus_paediatric_op_appointments
        description: Children criterion - 5+ attended paediatric outpatient
          appointments in 12 months (null for adults)
      - name: child_has_2plus_outpatient_specialties
        description: Children criterion - attended outpatient care across 2+
          treatment-function specialties in 12 months (null for adults)
      - name: child_has_mh_inpatient_stay
        description: Children criterion - 1+ mental health inpatient stay in
          12 months, MHSDS spells by start date (null for adults)
      - name: child_has_7plus_community_contacts
        description: Children criterion - 7+ attended community service
          contacts in 12 months, CSDS (null for adults)
