models:
  - name: fct_person_complex_adults
    description: 'Complex adults cohort v1.0. One row per person meeting all criteria:
      age >= 18, AND (moderate/severe frailty OR 3+ included LTCs), AND (>=2 NEL
      admissions OR >=3 ED attendances in last 12 months, OR housebound).
      Includes all persons regardless of registration status; filter is_active = TRUE
      for the currently registered population.

      Included LTCs (15): AF, asthma, CHD, CKD, COPD, dementia, depression, diabetes,
      epilepsy, heart failure, hypertension, SMI, stroke/TIA, Parkinson''s, anxiety.
      ED attendances count all urgent & emergency care settings from ECDS (Type 1/2
      A&E, UTC, WiC, SDEC). 12-month windows are rolling from the build date.'

    tests:
      - dbt_utils.at_least_one:
          column_name: person_id

    config:
      meta:
        owner:
          name: EddieDavison92

    columns:
      - name: person_id
        description: Unique identifier for the person
        tests:
          - unique
          - not_null
      - name: sk_patient_id
        description: Pseudonymised patient key for joining to SUS activity
      - name: is_active
        description: Currently registered with an NCL GP practice
      - name: age
        description: Current age (>= 18 for all cohort members)
      - name: ltc_count
        description: Count of the 15 included LTC registers the person is on
      - name: latest_frailty_severity
        description: Latest recorded frailty severity (Mild, Moderate, Severe, Unknown; null if not on frailty register)
      - name: has_moderate_severe_frailty
        description: Latest frailty severity is Moderate or Severe
      - name: nel_admissions_12mo
        description: Non-elective admissions in last 12 months (SUS APC, admission methods 2x, births excluded)
      - name: ed_attendances_12mo
        description: Urgent & emergency care attendances in last 12 months (ECDS, all department types - Type 1/2 A&E, UTC, WiC, SDEC)
      - name: is_housebound
        description: Latest housebound status is housebound
