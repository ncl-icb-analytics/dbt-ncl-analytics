version: 2

models:
  - name: source_content_freshness_snapshot_input
    description: >
      Current content date for each profiled DATA_LAKE schema. This thin view
      excludes freshness policy and status fields from the history snapshot.
    config:
      meta:
        owner:
          name: Eddie Davison
    columns:
      - name: source_schema
        description: DATA_LAKE source schema.
        data_tests:
          - not_null
          - unique
      - name: content_date
        description: Latest date represented by the source content.
        data_tests:
          - not_null
