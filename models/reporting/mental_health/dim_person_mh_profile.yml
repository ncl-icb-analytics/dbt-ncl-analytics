version: 2

models:
  - name: dim_person_mh_profile
    description: >
      MHSDS mental health profile for people with a referral, care contact, or
      occupancy-ruled inpatient spell. Grain: one row per person_id. Current
      state reflects the active MHSDS feed, which runs about six weeks behind
      the run date. Contact recency and Mental Health Act currency both measure
      back from the latest accepted reporting period end date, so the model uses
      one clock. Where providers submit different current patient indicators,
      the newest reporting period and file receipt take precedence. Referral and
      contact measures use the published MHSDS facts.
    config:
      meta:
        owner:
          name: Eddie Davison
    columns:
      - name: person_id
        description: MHSDS person identifier.
        data_tests:
          - unique
          - not_null
      - name: sk_patient_id
        description: Pseudonymised patient identifier.
      - name: n_referrals_ever
        description: Number of referral episodes.
      - name: n_open_referrals
        description: Number of referral episodes without a recorded closure.
      - name: first_referral_date
        description: First referral request received date.
      - name: latest_referral_date
        description: Latest referral request received date.
      - name: latest_contact_date
        description: Latest care contact date.
      - name: has_contact_last_12m
        description: >-
          Whether a contact is recorded in the 12 months ending at the latest
          accepted reporting period end date.
      - name: has_contact_last_90d
        description: >-
          Whether a contact is recorded in the 90 days ending at the latest
          accepted reporting period end date.
      - name: n_attended_contacts_12m
        description: >-
          Number of attended care contacts in the 12 months ending at the
          latest accepted reporting period end date.
      - name: n_contacts_with_missing_attendance_status_12m
        description: >-
          Number of contacts without an attendance status in the 12 months
          ending at the latest accepted reporting period end date.
      - name: has_crisis_contact_12m
        description: >-
          Whether an attended crisis-referral contact is recorded in the 12
          months ending at the latest accepted reporting period end date.
      - name: is_current_inpatient
        description: Whether the person has an open occupancy-ruled inpatient spell.
      - name: latest_admission_date
        description: Latest occupancy-ruled inpatient spell admission date.
      - name: latest_discharge_date
        description: Latest discharged occupancy-ruled inpatient spell end date.
      - name: n_spells_ever
        description: Number of occupancy-ruled inpatient spells.
      - name: ever_inpatient
        description: Whether the person has an occupancy-ruled inpatient spell.
      - name: icd10_3
        description: Latest three-character ICD-10 diagnosis code.
      - name: icd10_3_description
        description: Published description for the latest ICD-10 code.
      - name: diagnosis_category
        description: Currency population category for the latest diagnosis.
      - name: latest_diagnosis_date
        description: Latest diagnosis coding timestamp.
      - name: has_ever_had_formal_mha_status
        description: >-
          Whether any formal Mental Health Act legal status is recorded. Formal
          means any NHSD legal status other than informal admission (01), not
          applicable (98), unknown (99) and the -1 sentinel. It is broader than
          detention: community-based statuses such as Community Treatment Orders
          and recall, conditional discharge and guardianship all count. Use
          latest_formal_mha_status_code to narrow.
      - name: has_current_formal_mha_status
        description: >-
          Whether an open formal legal-status period appeared within the latest
          three accepted reporting periods and has not expired. Uses the same
          formal-status definition as has_ever_had_formal_mha_status, so a
          person living in the community under a Community Treatment Order,
          conditional discharge or guardianship is included. Use
          latest_formal_mha_status_code to narrow.
      - name: latest_formal_mha_status_start_date
        description: >-
          Start date of the latest formal Mental Health Act legal-status period.
          Null when no formal status is recorded.
      - name: latest_formal_mha_status_code
        description: >-
          NHSD legal-status code of the latest formal Mental Health Act period.
          Use it to narrow the flags to the statuses an analysis treats as
          detention.
      - name: latest_formal_mha_status_description
        description: >-
          UKHFD description for latest_formal_mha_status_code. Null when the
          submitted code is absent from the UKHFD classification.
      - name: child_protection_plan_status_code
        description: Latest submitted child protection plan status code.
      - name: child_protection_plan_status_description
        description: Published description for the child protection plan status.
      - name: looked_after_child_indicator_code
        description: Latest submitted looked-after-child indicator code.
      - name: looked_after_child_indicator_description
        description: Published description for the looked-after-child indicator.
      - name: is_looked_after_child
        description: Whether the latest indicator is yes; null for unknown or missing.
