version: 2

models:
  - name: fct_mhsds_clinical_record
    description: >-
      MHSDS clinical items, one row per retained diagnosis, accepted assessment
      question or dimension, or populated care-activity component. Includes
      accepted history, not just current patients. Distinct diagnosis codes
      and person identifiers remain separate; repeated dated diagnoses use
      their latest accepted row. Undated diagnoses and all assessment occurrences
      survive without unsupported deduplication. Assessments are not necessarily
      whole questionnaires, and clinical items are not encounters. Descriptions
      include authoritative labels and explicit unmatched states.
    config:
      meta:
        owner:
          name: Eddie Davison
    columns:
      - name: clinical_record_id
        description: "Identifier of the source occurrence and component type. Logical diagnoses survive reflow under the same person and key; assessment IDs change on replacement submissions."
        data_tests: [not_null, unique]
      - name: source_dataset
        description: "Source dataset, always MHSDS."
      - name: source_record_id
        description: "Source-occurrence key. Diagnosis keys identify a guarded logical diagnosis; assessments identify an accepted source row; activity components reuse the care-activity fact key."
      - name: source_row_id
        description: "Identifier of the retained submitted row in source_table."
      - name: source_table
        description: "MHSDS table supplying this clinical item."
      - name: clinical_record_type
        description: "Previous, provisional, primary or secondary diagnosis; referral or activity assessment; procedure, finding or observation."
      - name: person_id
        description: "MHSDS national person identifier of the retained record."
      - name: referral_source_record_id
        description: "Directly recorded provider-qualified service request identifier. Null for previous diagnoses without a referral link."
      - name: uniq_care_cont_id
        description: "Contact identifier recorded on the source. It is not a link to the latest contact state."
      - name: care_activity_source_record_id
        description: "Provider-period activity key linking to fct_mhsds_care_activity. Retained even when the parent is absent."
      - name: uniq_care_act_id
        description: "Source-derived activity identifier, scoped to the reporting period."
      - name: care_prof_local_id
        description: "MHS606 assessor's submitted local identifier. Null for other record types."
      - name: uniq_care_prof_local_id
        description: "MHS606 provider-qualified assessor identifier, retained for same-clinician outcome pairing."
      - name: clinical_at
        description: "Stored unzoned clinical timestamp, or date at midnight when only a date is available. Original offsets are unavailable; interpret with time basis, precision and source-date discrepancy flag. This is not disease onset."
      - name: clinical_time_precision
        description: "date, timestamp inherited from a contact, or stored_timestamp_precision_unknown when the original precision was lost upstream."
      - name: clinical_time_basis
        description: "Meaning and source of clinical time. Previous diagnoses use discussion time; MHS606 uses completion; MHS607 inherits its same-submission activity contact."
      - name: source_timestamp
        description: "Diagnosis or MHS606 timestamp as stored in the source pipeline, without its original offset. Null for inherited contact timing."
      - name: source_derived_date
        description: "Separate source-pipeline date for diagnoses and MHS606. Retained to expose discrepancies."
      - name: is_source_date_inconsistent
        description: "TRUE when a populated stored timestamp and separate derived date disagree on calendar date."
      - name: coding_scheme_code
        description: "Submitted scheme code. Interpret within coding_scheme_kind; diagnosis 02 and finding 01 both mean ICD-10. Null where the specification fixes SNOMED CT."
      - name: coding_scheme_kind
        description: "Which national scheme applies, or fixed_snomed when no submitted scheme is required."
      - name: clinical_code
        description: "Original diagnosis, assessment observable, procedure, finding or observation code."
      - name: standardised_snomed_code
        description: "Source-pipeline SNOMED CT mapping, kept separately from the submitted code."
      - name: clinical_value
        description: "Submitted assessment score or observation value as text. Null for records without a measured value."
      - name: unit_of_measurement_code
        description: "Recorded observation unit code. Assessment scores do not acquire an invented unit."
      - name: unit_of_measurement_description
        description: "Existing care-activity unit label from the warehouse dictionary."
      - name: unit_of_measurement_label_status
        description: "Existing care-activity unit lookup status. Null when no observation unit applies."
      - name: provider_organisation_code
        description: "Organisation submitting the clinical record."
      - name: uniq_submission_id
        description: "Accepted submission containing the retained source row."
      - name: reporting_period_start_date
        description: "Start of the accepted reporting period containing the retained row."
      - name: reporting_period_end_date
        description: "End of the accepted reporting period containing the retained row."
      - name: mhsds_version
        description: "MHSDS specification version recorded by the source pipeline."
      - name: source_file_received_at
        description: "Time the retained source file was received."
      - name: source_loaded_at
        description: "Time the retained source row was loaded."
      - name: first_reported_period_end_date
        description: "First accepted reporting period containing this guarded logical diagnosis; the source period for other clinical occurrences."
      - name: last_reported_period_end_date
        description: "Last accepted reporting period containing this guarded logical diagnosis. This is reporting evidence, not clinical resolution."
      - name: accepted_source_record_count
        description: "Number of accepted source rows represented by this retained diagnosis. One for each other clinical occurrence."
      - name: reported_period_count
        description: "Number of accepted reporting periods containing this guarded diagnosis. One for other clinical occurrences."
      - name: has_person_identifier_changed
        description: "TRUE when the diagnosis's source parent, scheme, code and time appear under different national person identifiers. Those identities are retained separately."
      - name: is_care_activity_linked
        description: "Whether a source activity or an activity-assessment parent is present. Null when no activity relationship applies."
      - name: is_care_activity_person_consistent
        description: "Whether the activity assessment and its same-submission parent have matching person identifiers; null if no applicable parent."
      - name: is_care_activity_referral_consistent
        description: "Whether the activity assessment and its parent record the same referral; null if no applicable parent."
      - name: is_care_activity_contact_consistent
        description: "Whether the activity assessment and its parent record the same contact. Submitted links are retained when they differ."
      - name: coding_scheme_description
        description: "Authoritative label for the applicable coding scheme."
      - name: standardised_snomed_description
        description: "Description of the separately recorded source-pipeline SNOMED CT mapping."
      - name: clinical_description
        description: "Authoritative submitted-code label, or a mapped SNOMED CT label for legacy Read codes. Interpret with clinical_label_status."
      - name: clinical_label_status
        description: "Distinguishes labelled codes, mapped legacy codes, missing codes, unmatched codes or expressions, and coding systems without a local reference."
      - name: sk_patient_id
        description: "Warehouse patient key from the established MHSDS bridge; null when no mapping exists."
      - name: provider_organisation_name
        description: "Organisation name from the established MHSDS organisation reference."
      - name: clinical_date
        description: "Calendar date of clinical_at. It is not an onset date."
      - name: clinical_time
        description: "Stored unzoned time; null when only date precision is known."
      - name: clinical_value_numeric
        description: "Parsed NUMBER(38,9) value. Source text remains available. Parse status identifies non-numeric values, overflow and rounding."
      - name: clinical_value_parse_status
        description: "value_missing, numeric, numeric_rounded, or not_numeric_or_out_of_range. Non-numeric does not necessarily mean an invalid assessment response."
      - name: is_clinical_date_after_reporting_period
        description: "TRUE when the stored clinical calendar date is after the accepted reporting period. This is a source comparison, not offset-aware submission validation; records remain present."
      - name: is_assessment_before_reporting_period
        description: "TRUE for MHS606 completion before its reporting period, FALSE otherwise on MHS606, and null for other types."
