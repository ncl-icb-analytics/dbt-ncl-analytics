version: 2

models:
  - name: fct_mhsds_referral_episodes
    description: >
      MHSDS referral summaries for access and currency analysis. Grain: one row
      per referral. Population: referrals in the latest active submissions.
      Contact, indirect-activity and inpatient measures cover records linked to
      the referral. Open means no rejection or discharge is recorded.
    config:
      meta:
        owner:
          name: Eddie Davison
    columns:
      - name: source_record_id
        description: Referral identifier used to join to fct_mhsds_referral.
        data_tests:
          - unique
          - not_null
      - name: source_dataset
        description: Source dataset. Always MHSDS.
      - name: uniq_serv_req_id
        description: MHSDS unique service request identifier.
      - name: person_id
        description: MHSDS person identifier.
      - name: sk_patient_id
        description: Pseudonymised patient identifier.
      - name: provider_organisation_code
        description: Provider organisation code.
      - name: derived_icb_commissioner_code
        description: ICB commissioner code derived in the source feed.
      - name: referral_request_received_date
        description: Date the referral request was received.
        data_tests:
          - not_null
      - name: age_at_referral
        description: Age on the referral request received date.
      - name: is_cyp_at_referral
        description: Whether age at referral is under 18.
      - name: source_of_referral_code
        description: Source of referral code.
      - name: referring_care_professional_type_code
        description: Type of referring care professional.
      - name: clinical_response_priority_code
        description: Clinical response priority code.
      - name: primary_reason_for_referral_code
        description: Primary mental health referral reason code.
      - name: referral_reason_category
        description: Currency population category from the referral reason.
      - name: service_or_team_type_code
        description: Referred-to mental health service or team type code.
      - name: source_service_or_team_type_name
        description: Service or team type name supplied by the provider.
      - name: team_type_category
        description: Currency population category from the service or team type.
      - name: setting_group
        description: Currency contact setting group.
      - name: setting_name
        description: Currency contact setting description.
      - name: is_crisis_referral
        description: Whether the referral meets the currency crisis rule.
      - name: n_contacts
        description: Care contacts linked to the referral.
      - name: n_attended_contacts
        description: Attended or missing-status care contacts.
      - name: n_dna_contacts
        description: Did-not-attend care contacts.
      - name: n_cancelled_contacts
        description: Cancelled care contacts.
      - name: first_contact_date
        description: First linked care contact date.
      - name: first_attended_contact_date
        description: First attended linked care contact date.
      - name: wait_days_to_first_attended_contact
        description: Days from referral receipt to the first attended contact.
      - name: has_pre_referral_contact
        description: Whether the first attended contact predates referral receipt.
      - name: n_indirect_activities
        description: Indirect activities linked to the referral.
      - name: n_spells
        description: Occupancy-ruled inpatient spells linked to the referral.
      - name: has_inpatient_spell
        description: Whether an occupancy-ruled inpatient spell is linked.
      - name: referral_rejection_date
        description: Referral rejection date.
      - name: rejection_reason_code
        description: Referral rejection reason code.
      - name: is_rejected
        description: Whether the referral is rejected.
      - name: referral_discharge_date
        description: Referral discharge date.
      - name: closure_reason_code
        description: Referral closure reason code.
      - name: referral_status
        description: 'Referral status: rejected, closed, or open.'
        data_tests:
          - accepted_values:
              arguments:
                values: ['rejected', 'closed', 'open']
