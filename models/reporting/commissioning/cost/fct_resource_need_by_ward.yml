version: 2
models:
  - name: fct_resource_need_by_ward
    description: >
      Resource vs need by residence ward (2025) for the WNL exposure
      population (includes deceased and deducted). Drives the ward
      choropleths in the Aligning Resource to Need pack: cost per
      person-year, age-sex-weighted exposure, spend per weighted year, and
      the resource-to-need index (actual / expected). Denominators are
      WNL-registered person-time by residence ward, NOT ONS ward populations
      - boundary wards with many non-WNL-registered residents are partial.
    config:
      meta:
        owner:
          name: Eddie Davison
    columns:
      - name: ward
        description: Residence ward 2025 name.
        data_tests:
          - not_null
      - name: residence_borough
        description: Residence local authority / borough.
      - name: population
        description: Persons with WNL registration exposure resident in the ward.
      - name: person_years
        description: Registered person-years in the window.
      - name: weighted_person_years
        description: Age-sex-weighted exposure (expected cost / WNL mean rate per person-year).
      - name: cost_per_person_year
        description: Actual window spend per registered person-year (GBP).
      - name: spend_per_weighted_year
        description: Spend per age-weighted person-year (GBP) = index x WNL mean rate.
      - name: resource_to_need_index
        description: actual / expected. >1 = above age-sex-expected spend.
