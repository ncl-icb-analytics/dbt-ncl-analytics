version: 2
models:
  - name: fct_person_resource_need_olids
    description: >
      NCL deep-dive on fct_person_resource_need (registered sub-ICB 93C
      only), enriched with OLIDS primary-care context - Cambridge
      comorbidity score, LTC register count, frailty severity, GP
      appointment cost (PSSRU nominal, additive) and the EPD prescribing
      breakout (a component of actual_cost_12m, not an addition). Same
      person grain as the base fact; has_olids_record flags patients with
      an OLIDS link. Cut spend vs need by morbidity (score bands, LTC
      count, frailty) x deprivation quintile for the NCL pack.
    config:
      meta:
        owner:
          name: Eddie Davison
    columns:
      - name: sk_patient_id
        description: DMIC pseudonymised NHS number (primary key; fan-out tripwire).
        data_tests:
          - not_null
          - unique
      - name: has_olids_record
        description: TRUE when the patient bridges to an OLIDS person record.
      - name: cambridge_comorbidity_score
        description: Cambridge Multimorbidity Score; null when no OLIDS score.
      - name: ltc_count
        description: Distinct LTC registers (0 when no OLIDS record).
      - name: frailty_severity
        description: Mild / Moderate / Severe; null when not on the frailty register.
      - name: gp_appointment_cost_12m
        description: Attended GP appointment cost over the window (PSSRU nominal GBP). Additive.
      - name: prescribing_cost_12m
        description: EPD prescribing component of actual_cost_12m (GBP).
      - name: prescribing_months_covered
        description: Window months the EPD feed covers (trailing feed - not a person property).
      - name: total_cost_incl_gp_appointments_12m
        description: actual_cost_12m + GP appointment cost (GBP).
        data_tests:
          - not_null
