models:
  - name: cltcs_monthly_covariates
    description: >
      Monthly point-in-time covariate panel for the C-LTCS matched-control candidate pool.
      One row per (patient_id, index_date): each control candidate's covariate profile
      reconstructed as-at index_date. The spine is the monthly population roster
      (cltcs_population_monthly_capture) for that month (INNER = eligibility gate); covariates
      are read as-at from their SCD2 snapshots via temporal_join (LEFT) and from the monthly
      activity capture. Columns mirror cltcs_cohort_data for comparability. All patients are
      kept -- the treated/control split happens at matching. Covariates with no history yet
      are listed commented-out in a GAP block in the model.
    config:
      meta:
        owner:
          name: Thomas Shallcross
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - patient_id
              - index_date
    columns:
      - name: patient_id
        description: "Commissioning patient key (sk_patient_id). Part of the grain."
        data_tests:
          - not_null
      - name: index_date
        description: "As-at date the covariates are reconstructed for. Part of the grain."
        data_tests:
          - not_null
      - name: re_id_key
        description: "HxFlake pseudonym generated from patient_id (for re-identification)."
      - name: neighbourhood_code
        description: "C-LTCS local neighbourhood tag, carried from the population roster for that month; may be null."
      - name: efi_score
        description: "AIC eFI2 score as-at index_date. NULL = not assessed (not coalesced)."
      - name: cambridge_comorbidity_score
        description: "Cambridge multimorbidity score as-at index_date. NULL = not computed."
      - name: moc_stage_completed_label
        description: "LTC-LCS Model of Care stage. Ride-along on the risk-summary snapshot (not a check_col), so it reflects the last risk-group version open and may lag index_date."
      - name: moc_pathway_status
        description: "LTC-LCS Model of Care pathway status. Ride-along (see moc_stage_completed_label caveat)."
      - name: score_treatment
        description: "C-LTCS treatment sub-score as-at index_date."
      - name: score_frailty
        description: "C-LTCS frailty sub-score as-at index_date. (score_activation / score_coordination deferred until snapshotted.)"
      - name: care_processes_completed
        description: >
          Number of the 8 diabetes care processes (HbA1c, BP, cholesterol, creatinine, urine
          ACR, foot check, BMI, smoking) with a reading in the 12 months to index_date.
          Reconstructed as-at index_date: the latest measurement dates are read from
          fct_person_diabetes_9_care_processes_snapshot and the rolling 12-month window is
          re-applied on index_date. 0 for anyone not on the diabetes register as-at index_date.
      - name: latest_hba1c_value
        description: "Value of the latest HbA1c reading, only when that reading falls within 12 months of index_date (else NULL), mirroring cltcs_cohort_data."
      - name: latest_hba1c_date
        description: "Date of the latest HbA1c reading as-at index_date (ungated)."
      # Adult social care (ASC) -- captured monthly (cltcs_asc_monthly_capture); values are as-at
      # the captured month, forward-only (null -> coalesced defaults before the capture's first run).
      - name: has_asc_service
        description: "1 if the patient had any ASC service in the captured month, else 0 (presence flag; coalesced to 0 when absent)."
      - name: borough_name
        description: "Array of distinct local-authority (borough) names for the patient's ASC services, as-at the captured month. Distinct from neighbourhood_code. Empty array when absent."
      - name: service_type
        description: "Array of distinct ASC service types for the patient, as-at the captured month. Empty array when absent."
      - name: primary_support_reason_category
        description: "Array of distinct high-level ASC primary support reason categories, as-at the captured month. Empty array when absent."
      - name: has_physical_support_personal_care
        description: "Patient had an ASC service with personal care physical support in the captured month."
      - name: has_physical_support_access_mobility
        description: "Patient had an ASC service with access and mobility physical support in the captured month."
      - name: has_learning_disability_support
        description: "Patient had an ASC service with learning disability support in the captured month."
      - name: has_mental_health_support
        description: "Patient had an ASC service with mental health support in the captured month."
      - name: has_unknown_primary_support_reason
        description: "Patient had an ASC service with an unknown primary support reason in the captured month."
      - name: has_memory_cognition_support
        description: "Patient had an ASC service with memory and cognition support in the captured month."
      - name: has_social_support_unpaid_carer
        description: "Patient had an ASC service with social support for an unpaid carer in the captured month."
      - name: has_social_support_social_isolation
        description: "Patient had an ASC service with social support for social isolation or other in the captured month."
      - name: has_sensory_support_visual_impairment
        description: "Patient had an ASC service with sensory support for visual impairment in the captured month."
      - name: has_sensory_support_hearing_impairment
        description: "Patient had an ASC service with sensory support for hearing impairment in the captured month."
      - name: has_social_support_substance_misuse
        description: "Patient had an ASC service with social support for substance misuse in the captured month."
      - name: has_sensory_support_dual_impairment
        description: "Patient had an ASC service with sensory support for dual impairment in the captured month."
      - name: has_social_support_asylum_seeker
        description: "Patient had an ASC service with social support for asylum seekers in the captured month."
      - name: attendance_difficulty_score
        description: >
          Sum of main_language_flag + has_severe_mental_illness + has_learning_disability +
          has_asc_service (mirrors cltcs_cohort_data). Now computable since has_asc_service is
          available from the ASC capture.
      # Waiting list flag + array -- captured monthly (cltcs_activity_monthly_capture, alongside the
      # WL counts); values are as-at the captured month, forward-only (null -> coalesced defaults on
      # months captured before these columns were added).
      - name: has_same_tfc_multiple_providers_flag
        description: "True if the patient has an open waiting list for the same treatment-function code under more than one provider, as-at the captured month. Coalesced to false when absent."
      - name: current_waiting_list_arrays
        description: >
          Array of the patient's open waiting-list entries as-at the captured month, each an object of
          provider / tfc_name / days_on_waiting_list / days_until_future_appointment. Empty array when
          absent.
