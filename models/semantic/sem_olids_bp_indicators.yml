version: 2

models:
  - name: sem_olids_bp_indicators
    description: |
      OLIDS NICE blood pressure indicators semantic view. One row represents
      one person in one NICE indicator on the reporting date.

      Covers IND239 to IND246 for hypertension, coronary heart disease,
      stroke/TIA and peripheral arterial disease. Provides denominator,
      numerator and care-gap metrics with practice, geography, ethnicity and
      deprivation dimensions. Personalised care adjustments are not applied.

      Filter indicator_id before using metrics because a person can appear in
      more than one indicator. Secondary-use consumers must join
      DIM_PERSON_SECONDARY_USE_ALLOWED to apply National Data Opt-Out and Type 1
      opt-out filtering.
    config:
      materialized: semantic_view
      schema: SEMANTIC
      meta:
        owner:
          name: Eddie Davison
