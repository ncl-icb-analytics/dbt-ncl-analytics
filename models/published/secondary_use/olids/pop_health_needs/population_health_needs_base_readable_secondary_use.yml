models:
  - name: population_health_needs_base_readable_secondary_use
    description: |
      Population health needs base readable table for secondary use (Section 251 exempt).
      Published under a Section 251 exemption as a HealtheIntent replacement dashboard; opt-out filtering is intentionally NOT applied. Passthrough of the direct care base.
      See population_health_needs_base_readable in published_reporting_direct_care for full details.

    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: person_id
        tests:
          - unique
          - not_null