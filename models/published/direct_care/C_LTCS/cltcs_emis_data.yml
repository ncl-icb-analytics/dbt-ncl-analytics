version: 2

models:
  - name: cltcs_emis_data
    description: >
      CLTCS EMIS patient attributes restricted to GP practices in scope for C-LTCS.
      One row per patient from cltcs_emis_extract where usual GP practice_code matches
      cltcs_organisations_in_scope; area_code and area_name come from that join.
      Used to surface EMIS-sourced patients on the patient list (source = emis).
    config:
      meta:
        owner:
          name: Emily Baldwin
    data_tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: patient_id
        data_type: varchar
        description: Pseudonymised NHS number (sk_patient_id from EMIS extract)
        data_tests:
          - not_null
          - unique:
              config:
                severity: warn

      - name: area_code
        data_type: varchar
        description: In-scope neighbourhood code (PCN) for the patient's usual GP practice
        data_tests:
          - not_null

      - name: area_name
        data_type: varchar
        description: In-scope neighbourhood name for the patient's usual GP practice
        data_tests:
          - not_null

      - name: ltc_lcs
        data_type: varchar
        description: Long-term conditions / LCS indicator from the EMIS extract

      - name: borough
        data_type: varchar
        description: Borough associated with the patient in the EMIS extract

      - name: practice_code
        data_type: varchar
        description: Usual GP organisation ODS code from the EMIS extract
        data_tests:
          - not_null

      - name: age
        data_type: number
        description: Patient age in years from EMIS patient details

      - name: date_of_birth
        data_type: date
        description: Patient date of birth from EMIS patient details

      - name: gender
        data_type: varchar
        description: Patient gender from EMIS patient details

      - name: ethnic_origin
        data_type: varchar
        description: Patient ethnic origin from EMIS patient details

      - name: townsend_score
        data_type: number
        description: Townsend deprivation score from EMIS patient details

      - name: lower_layer_area_2001
        data_type: varchar
        description: Lower layer super output area (2001 census) from EMIS patient details

      - name: middle_layer_area_2001
        data_type: varchar
        description: Middle layer super output area (2001 census) from EMIS patient details

      - name: lower_layer_area_2011
        data_type: varchar
        description: Lower layer super output area (2011 census) from EMIS patient details

      - name: middle_layer_area_2011
        data_type: varchar
        description: Middle layer super output area (2011 census) from EMIS patient details

      - name: record_of_interpreter_information
        description: Flag indicating a record of interpreter information exists in EMIS

      - name: homelessness
        description: Flag indicating homelessness recorded in EMIS

      - name: housebound
        description: Flag indicating housebound status recorded in EMIS

      - name: care_home_resident
        description: Flag indicating care home resident status recorded in EMIS

      - name: cardiovascular_disease
        description: Flag indicating cardiovascular disease recorded in EMIS

      - name: atrial_fibrillation
        description: Flag indicating atrial fibrillation recorded in EMIS

      - name: hypertension
        description: Flag indicating hypertension recorded in EMIS

      - name: hyperlipidaemia
        description: Flag indicating hyperlipidaemia recorded in EMIS

      - name: diabetes
        description: Flag indicating diabetes recorded in EMIS

      - name: chronic_kidney_disease
        description: Flag indicating chronic kidney disease recorded in EMIS

      - name: na_fatty_liver_disease
        description: Flag indicating non-alcoholic fatty liver disease recorded in EMIS

      - name: copd
        description: Flag indicating COPD recorded in EMIS

      - name: asthma
        description: Flag indicating asthma recorded in EMIS

      - name: serious_mi
        description: Flag indicating serious myocardial infarction recorded in EMIS

      - name: learning_disability
        description: Flag indicating learning disability recorded in EMIS

      - name: frailty
        description: Flag indicating frailty recorded in EMIS

      - name: smoking_status_date
        data_type: date
        description: Date of latest smoking status observation in EMIS

      - name: smoking_status_code
        data_type: varchar
        description: SNOMED/code term for latest smoking status in EMIS

      - name: smoking_status_value
        data_type: varchar
        description: Value for latest smoking status in EMIS

      - name: bmi_date
        data_type: date
        description: Date of latest BMI observation in EMIS

      - name: bmi_code
        data_type: varchar
        description: SNOMED/code term for latest BMI in EMIS

      - name: bmi_value
        data_type: number
        description: Latest BMI value in EMIS

      - name: o_e_bp_reading_date
        data_type: date
        description: Date of latest O/E blood pressure reading in EMIS

      - name: o_e_bp_reading_code
        data_type: varchar
        description: SNOMED/code term for latest O/E blood pressure reading in EMIS

      - name: o_e_bp_reading_value
        data_type: number
        description: Primary value for latest O/E blood pressure reading in EMIS

      - name: o_e_bp_reading_secondary_value
        data_type: number
        description: Secondary value for latest O/E blood pressure reading in EMIS

      - name: hba1_c_date
        data_type: date
        description: Date of latest HbA1c observation in EMIS

      - name: hba1_c_code
        data_type: varchar
        description: SNOMED/code term for latest HbA1c in EMIS

      - name: hba1_c_value
        data_type: number
        description: Latest HbA1c value in EMIS

      - name: egfr_date
        data_type: date
        description: Date of latest eGFR observation in EMIS

      - name: egfr_code
        data_type: varchar
        description: SNOMED/code term for latest eGFR in EMIS

      - name: egfr_value
        data_type: number
        description: Latest eGFR value in EMIS

      - name: uacr_date
        data_type: date
        description: Date of latest uACR observation in EMIS

      - name: uacr_code
        data_type: varchar
        description: SNOMED/code term for latest uACR in EMIS

      - name: uacr_value
        data_type: number
        description: Latest uACR value in EMIS

      - name: tc_date
        data_type: date
        description: Date of latest total cholesterol observation in EMIS

      - name: tc_code
        data_type: varchar
        description: SNOMED/code term for latest total cholesterol in EMIS

      - name: tc_value
        data_type: number
        description: Latest total cholesterol value in EMIS

      - name: ldl_date
        data_type: date
        description: Date of latest LDL observation in EMIS

      - name: ldl_code
        data_type: varchar
        description: SNOMED/code term for latest LDL in EMIS

      - name: ldl_value
        data_type: number
        description: Latest LDL value in EMIS

      - name: moc_check_test_appointment_on_date
        data_type: date
        description: Date of memory clinic check-test appointment on record in EMIS

      - name: moc_follow_up_appointment_on_date
        data_type: date
        description: Date of memory clinic follow-up appointment on record in EMIS

      - name: rpt_count_count
        data_type: number
        description: Report count from the EMIS extract

      - name: record_source
        data_type: varchar
        description: Source system identifier for the EMIS record

      - name: metadata_record_ingestion_timestamp
        data_type: timestamp_ntz
        description: Timestamp when the source EMIS record was ingested

      - name: pds_registered_practice_code
        data_type: varchar
        description: GP practice_code from dim_person_demographics_basic (PDS registration)

      - name: pds_registered_practice_mismatch_flag
        description: >
          True when EMIS usual GP practice_code differs from PDS registered practice_code
          (including null vs non-null)
        data_tests:
          - not_null

      - name: olids_current_practice_code
        data_type: varchar
        description: Current GP practice ODS code from OLIDS dim_person

      - name: olids_current_practice_mismatch_flag
        description: >
          True when EMIS usual GP practice_code differs from OLIDS current_practice_code
          (including null vs non-null)
