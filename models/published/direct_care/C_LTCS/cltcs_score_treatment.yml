models:
  - name: cltcs_score_treatment
    description: "Treatment sub-score for C-LTCS cohort. One row per patient. Derived from QOF conditions, A&E/GP usage, polypharmacy, age and asthma/BP treatment flags."
    config:
      meta:
        owner:
          name: Emily Baldwin
    columns:
      - name: patient_id
        data_type: number
        description: "Unique patient identifier from commissioning data"
        data_tests:
          - unique
          - not_null

      - name: area_code
        data_type: varchar
        description: "Area code (PCN in this context)"
        data_tests:
          - not_null

      - name: age_adjusted_score_treatment
        data_type: number
        description: "score_treatment with age multiplier: +15% max at age 18 (flat below 18), linear to neutral at 60, then up to -15% penalty from age 100+"
