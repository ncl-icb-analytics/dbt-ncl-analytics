models:
  - name: smi_population_base_dm
    description: Database model view holding demographics and core metrics for people on the SMI register

    config:
      meta:
        owner:
          name: KateHomer55
    data_tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: person_id
        data_tests:
          - unique
          - not_null
