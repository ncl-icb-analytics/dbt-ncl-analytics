models:
  - name: stg_aic_base_ccms_snomed_codes
    description: |
      Staging wrapper for the AIC-published CCMS SNOMED codelist
      (BASE_CCMS_SNOMED_CODES). Used by the in-house CCMS pipeline
      under modelling/olids/risk_stratification.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: conditionid
        description: CCMS condition identifier.
        data_tests:
          - not_null
      - name: conditionname
        description: CCMS condition name.
      - name: conceptid
        description: SNOMED concept code mapped to the condition.
        data_tests:
          - not_null
      - name: primaryterm
        description: SNOMED preferred term for the concept.
