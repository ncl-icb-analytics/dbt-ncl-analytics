models:
  - name: stg_aic_base_ccms_dmd_codes
    description: |
      Staging wrapper for the AIC-published CCMS dm+d codelist
      (BASE_CCMS_DMD_CODES). Used by the in-house CCMS pipeline
      under modelling/olids/multimorbidity.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: conditionid
        description: CCMS condition identifier.
        tests:
          - not_null
      - name: conditionname
        description: CCMS condition name.
      - name: productid
        description: dm+d product code mapped to the condition.
        tests:
          - not_null
      - name: primaryterm
        description: dm+d preferred term for the product.
