models:
  - name: stg_olids_practitioner_in_role
    description: Practitioner roles and their employment history at organisations. Deduplicated by id and filtered to exclude deleted records.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: id
        description: Primary key - unique identifier for this practitioner role
        tests:
          - unique
          - not_null
      - name: practitioner_id
        description: Foreign key to practitioner.id
      - name: employer_organisation_id
        description: Foreign key to organisation.id - organisation where practitioner works
      - name: role_code
        description: Code for the practitioner role
      - name: role
        description: Description of the practitioner role
      - name: date_employment_start
        description: Start date of employment in this role
      - name: date_employment_end
        description: End date of employment in this role
      - name: lds_id
        description: LDS system identifier
      - name: publisher_organisation_code
        description: "ODS code of the publisher organisation (post-2026 OLIDS rename — was record_owner_organisation_code)"
      - name: lds_datetime_first_acquired
        description: Datetime when data was acquired by LDS
      - name: lds_start_datetime
        description: LDS datetime stamp from which the record version was correct - used for deduplication to get the latest record
      - name: lds_is_deleted
        description: Deletion flag - records with TRUE are filtered out in this staging layer
      - name: lds_source_record_id
        description: LDS assigned unique identifier for the source record version
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1