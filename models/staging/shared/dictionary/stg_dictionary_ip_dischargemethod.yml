models:
  - name: stg_dictionary_ip_dischargemethod
    description: >-
      Inpatient discharge methods from the shared dictionary, with one row per
      discharge method code. Retains all supplied dictionary entries.
    # Business owner must be confirmed before this change is ready for review.
    columns:
      - name: sk_discharge_method_id
        data_type: number(38,0)
        description: Surrogate identifier for the dictionary entry.
        data_tests:
          - unique
          - not_null
      - name: bk_discharge_method_code
        data_type: varchar
        description: Discharge method code used to join the submitted APC spell code.
        data_tests:
          - unique
          - not_null
      - name: discharge_method_name
        data_type: varchar
        description: Dictionary label describing how the patient was discharged.
