models:
  - name: stg_reference_opencodelists
    description: >
      OpenCodelists reference terminology mapping codelists to individual codes across coding systems (SNOMED, BNF, ICD-10, etc.).
      Deduplicated via qualify on codelist_org, codelist_slug, codelist_name, version_hash, coding_system, code, term and cluster_id.
    config:
      meta:
        owner:
          name: EddieDavison92
        deduplication_qualify: >
          qualify row_number() over (
            partition by
              codelist_org,
              codelist_slug,
              codelist_name,
              version_hash,
              coding_system,
              code,
              term,
              cluster_id
            order by code
          ) = 1
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - codelist_org
              - codelist_slug
              - codelist_name
              - version_hash
              - coding_system
              - code
              - term
              - cluster_id
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: codelist_org
        description: Organisation that published the codelist (e.g. opencodelists)
        tests:
          - not_null
      - name: codelist_slug
        description: Unique slug identifier for the codelist
        tests:
          - not_null
      - name: codelist_name
        description: Human-readable name of the codelist
      - name: version_hash
        description: Hash of the codelist version for change detection
      - name: coding_system
        description: Coding system for the code (e.g. snomed, bnf, icd10)
        tests:
          - not_null
      - name: code
        description: Individual code within the codelist
        tests:
          - not_null
      - name: term
        description: Display term for the code
      - name: cluster_id
        description: Internal cluster identifier for the codelist
