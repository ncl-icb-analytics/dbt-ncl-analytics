models:
  - name: stg_reference_gp_practice
    description: WNL GP practice reference (NCL + NWL) - practice, PCN, borough and neighbourhood, one row per practice.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: gp_practice_code
        description: Primary key - GP practice (ODS) code.
        tests:
          - unique
          - not_null
      - name: practice_name
        description: GP practice name.
      - name: borough
        description: Borough (geographic).
      - name: pcn_code
        description: PCN code.
      - name: pcn_name
        description: PCN name.
      - name: neighbourhood_code
        description: Neighbourhood code.
      - name: neighbourhood_name
        description: Neighbourhood name.
    tests:
      # warn-only: the GP_PRACTICE_WNL source is a fragile analyst view that can
      # empty when the ODS Dictionary is re-keyed (hardcoded SK_ParentOrg_IDs).
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
          config:
            severity: warn
