models:
  - name: stg_dictionary_ecds_arrivalmode
    description: ECDS arrival mode reference dictionary
    config:
      meta:
        owner:
          name: Emily Baldwin
    columns:
      - name: ecds_unique_id
        description: Primary key - ECDS unique identifier
        data_tests:
          - unique
          - not_null
      - name: snomed_code
        description: SNOMED CT code
        data_tests:
          - not_null
    data_tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1