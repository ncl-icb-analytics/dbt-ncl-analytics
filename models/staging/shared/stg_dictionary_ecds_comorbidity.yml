models:
  - name: stg_dictionary_ecds_comorbidity
    description: ECDS comorbidity reference data mapping SNOMED codes to ECDS descriptions
    config:
      meta:
        owner:
          name: Emily Baldwin
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - ecds_unique_id
              - valid_from
    columns:
      - name: ecds_unique_id
        description: ECDS unique identifier (part of composite key with valid_from)
        data_tests:
          - not_null
      - name: snomed_code
        description: SNOMED CT code
        data_tests:
          - not_null
      - name: valid_from
        description: Valid from date (part of composite key with ecds_unique_id)
        data_tests:
          - not_null