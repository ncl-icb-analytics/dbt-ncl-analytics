models:
  - name: stg_reference_imd2019
    description: Index of Multiple Deprivation 2019 deciles by LSOA
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: lsoacode
        description: Primary key - LSOA code
        data_tests:
          - unique
          - not_null
      - name: imddecile
        description: IMD decile (1 = most deprived, 10 = least deprived)
        data_tests:
          - not_null
    data_tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1