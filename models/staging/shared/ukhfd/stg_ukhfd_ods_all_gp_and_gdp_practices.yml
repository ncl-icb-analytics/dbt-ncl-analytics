models:
  - name: stg_ukhfd_ods_all_gp_and_gdp_practices
    description: 'National ODS GP and dental practice dimension from UKHFD, latest record per practice code'
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: organisation_code
        description: practice ODS code, upper-cased
        data_tests:
          - unique
          - not_null
      - name: organisation_name
        description: practice name
