version: 2

models:
  - name: stg_ukhfd_weighted_regs_by_gp_practice_base
    description: UKHFD practice-level need indices and weighted populations by allocation base year.
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [practice_code, metric_name, financial_year_start]
    columns:
      - name: practice_code
        description: GP practice ODS code.
        data_tests:
          - not_null
      - name: metric_name
        description: UKHFD need index or weighted-population measure.
        data_tests:
          - not_null
      - name: metric_value
        description: Numeric metric value.
        data_tests:
          - not_null
      - name: financial_year_start
        description: First day of the allocation base financial year.
        data_tests:
          - not_null
      - name: source_file_version
        description: UKHFD source-file version for the snapshot.
