version: 2

models:
  - name: stg_source_content_freshness
    description: >
      Source-specific content-currency signals used by the reporting freshness
      contract. Every row is derived from fields inside the source data.
    config:
      meta:
        owner:
          name: Eddie Davison
    columns:
      - name: source_schema
        description: Logical source identifier shown in freshness reporting.
        data_tests:
          - not_null
          - unique
      - name: content_date
        description: Consensus content date used for freshness status.
        data_tests:
          - not_null
      - name: latest_content_date
        description: Latest valid content date present in the source.
        data_tests:
          - not_null
      - name: consensus_content_date
        description: Date representing the source's normal breadth of coverage.
        data_tests:
          - not_null
