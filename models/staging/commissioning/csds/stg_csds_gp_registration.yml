version: 2

models:
  - name: stg_csds_gp_registration
    description: >
      CSDS GP registrations. Grain: one row per person_id, practice_code and
      registration_start_date. Population: CYP002 GP registration records.
      Time semantics: the latest submitted record per registration is retained.
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - practice_code
              - registration_start_date
    columns:
      - name: person_id
        description: CSDS person identifier.
        data_tests:
          - not_null
      - name: practice_code
        description: GP practice code.
        data_tests:
          - not_null
      - name: registration_start_date
        description: GP registration start date.
      - name: registration_end_date
        description: GP registration end date.
      - name: organisation_code_ccg_of_gp_practice
        description: CCG code of the GP practice.
