version: 2

models:
  - name: stg_csds_servicetype
    description: >
      CSDS service types. Grain: one row per unique_service_request_identifier.
      Population: service type records in CYP102. Time semantics: where a
      referral has more than one submitted service type, the latest submission
      is retained. The NHSE script instead ranks reason-known-first per contact.
    config:
      meta:
        owner:
          name: Eddie Davison
    columns:
      - name: unique_service_request_identifier
        description: Unique service request identifier.
        data_tests:
          - not_null
          - unique
      - name: person_id
        description: CSDS person identifier.
      - name: team_type_code
        description: Service or team type referred to code.
