version: 2

models:
  - name: stg_csds_mpi
    description: >
      CSDS master patient index records. Grain: one row per person_id.
      Population: CYP001 person records. Time semantics: the latest submitted
      residence is retained, not residence at an event; period history is a
      known refinement.
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: person_id
        description: CSDS person identifier.
        data_tests:
          - unique
          - not_null
      - name: lsoa21_residence
        description: 2021 LSOA code for latest submitted residence.
      - name: lsoa11_residence
        description: 2011 LSOA code for latest submitted residence.
      - name: local_authority_district
        description: Local authority district of usual address.
      - name: electoral_ward_of_usual_address
        description: Electoral ward of usual address.
      - name: sub_icb_of_residence
        description: Sub-ICB location code of residence.
      - name: person_stated_gender_code
        description: Person-stated gender code.
      - name: person_death_date
        description: Person death date.
      - name: dmic_ethnic_category_group
        description: Derived ethnic category group.
      - name: org_id
        description: Provider organisation code.
