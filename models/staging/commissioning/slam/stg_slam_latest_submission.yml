    config:
      meta:
        owner:
          name: Eddie Davison
    columns:
      - name: meta_sk_row_id
        description: Surrogate row key; unique guards against lookup-join fan-out.
        data_tests:
          - not_null
          - unique

  - name: stg_lsdeplcm_latest
    description: |
      SLAM high-cost devices PLD, current provider statement only —
