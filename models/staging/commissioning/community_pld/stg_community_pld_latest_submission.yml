version: 2

models:
  - name: stg_community_pld_latest_submission
    description: |
      Latest-submission lookup for the community PLD feeds (COMOPL, REF): one
      row per (feed, provider, FY, month) slice identifying the file holding the
      current provider statement. Built from the staging outputs joined to
      META_FILE_REGISTRY load time. These DLP feeds restate cumulatively
      (Flex -> Freeze), so summing the raw staging tables double-counts ~4.7x;
      the stg_*_latest views use this to filter to the current statement.
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - feed
              - dv_provider_code
              - dv_financial_year
              - dv_financial_month
    columns:
      - name: feed
        description: COMOPL or REF.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['COMOPL', 'REF']
      - name: meta_file_id
        description: Winning file id for the slice.
        data_tests:
          - not_null
      - name: submission_loaded_at
        description: ISL load time of the winning file (ranking key).

  - name: stg_comopl_latest
    description: |
      COMOPL current provider statement only - stg_comopl restricted to the
      winning file per (provider, FY, month). Sum-safe; cumulative restatements
      excluded. Report from this rather than stg_comopl.
    config:
      meta:
        owner:
          name: Eddie Davison
    columns:
      - name: meta_sk_row_id
        description: Surrogate row key; unique guards against lookup-join fan-out.
        data_tests:
          - not_null
          - unique

  - name: stg_ref_latest
    description: |
      Community Referrals current provider statement only - stg_ref restricted
      to the winning file per (provider, FY, month). Sum-safe; cumulative
      restatements excluded. Report from this rather than stg_ref.
    config:
      meta:
        owner:
          name: Eddie Davison
    columns:
      - name: meta_sk_row_id
        description: Surrogate row key; unique guards against lookup-join fan-out.
        data_tests:
          - not_null
          - unique
