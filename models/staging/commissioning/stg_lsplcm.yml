version: 2

models:
  - name: stg_lsplcm
    description: |
      Cleaned SLAM PLD (LSPLCM) — provider patient-level contract-monitoring
      submissions from ServicesDataLocal. Grain 1:1 with DATA_LAKE.SDL.LSPLCM;
      columns <5% populated dropped (~520 of 580). Incremental (pure append of
      new files); full-refresh after an upstream SDL rebuild.

      Full submission history. SLAM files are cumulative-YTD restatements, so
      summing this table double-counts — report from stg_lsplcm_latest (or
      join stg_slam_latest_submission) for the current provider statement.

      Cleaning: dv_financial_year validated to 'YYYYYY' with file-name FY token
      fallback; dv_financial_month validated to 1-12; costs/activity numeric
      (currency symbols, commas, accounting negatives handled);
      DATE_AND_TIME_DATA_SET_CREATED multi-format parsed. Raw values retained
      alongside (*_raw).
    config:
      meta:
        owner:
          name: Eddie Davison
    columns:
      - name: meta_sk_row_id
        description: Surrogate row key from the SDL pipeline.
        data_tests:
          - not_null
          - unique
      - name: meta_file_id
        description: SDL source file id. Joins to META_FILE_REGISTRY with meta_batch_id.
        data_tests:
          - not_null
      - name: meta_partition_date
        description: DSCRO monthly partition the file was loaded under (one per file).
      - name: submission_loaded_at
        description: |
          When ISL/OneLondon processed the file (META_FILE_REGISTRY.CREATED_DATETIME).
          The reliable submission ordering — file_id is not monotonic with load
          time and the provider-typed created field has DQ issues.
      - name: submission_file_name
        description: Original provider file name from the registry.
      - name: dv_financial_year
        description: |
          Validated financial year as 'YYYYYY' (e.g. '202627'). Provider value
          where it parses to consecutive years; else the FY token from the
          platform file-name prefix; else NULL (e.g. bare calendar years —
          ambiguous). Original in financial_year_raw.
      - name: dv_financial_month
        description: Financial month 1 (April) - 12 (March). Junk values -> NULL.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 12
                inclusive: true
      - name: dv_dataset_created_at
        description: |
          DATE_AND_TIME_DATA_SET_CREATED multi-format parsed (>99.99% of
          populated values). Provider-typed: prefer submission_loaded_at for
          ordering. Original in dataset_created_raw.
      - name: dv_provider_code
        description: |
          Provider ODS code cleaned via dictionary lookup (site-suffixed codes
          like RAS00 resolve to RAS when not a valid org code). Original in
          provider_code.
        data_tests:
          - not_null
      - name: sk_patient_id
        description: |
          Pseudonymised NHS-number-derived patient hash (SK_PATIENT_ID_NHS_NUMBER).
          Matches sk_patient_id in stg_sus_*, stg_csds_*, stg_mhsds_*. ~88% populated.
      - name: dv_activity_count
        description: ACTIVITY_COUNT_POINT_OF_DELIVERY as NUMBER(38,6).
      - name: dv_activity_unit_price
        description: ACTIVITY_UNIT_PRICE as NUMBER(38,6).
      - name: dv_total_cost
        description: TOTAL_COST as NUMBER(38,6). £/commas/'TBC' handled; sum-safe.
