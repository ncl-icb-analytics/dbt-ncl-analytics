models:
  - name: stg_sus_op_monthly_encounterdiagnosis
    description: 'Encounter diagnosis from SUS data.
      One row per encounter.
      '
    config:
      meta:
        owner:
          name: Poya Khalaj
    columns:
      - name: sk_encounter_id
        description: Unique identifier for the appointment (SK_EncounterID)
        tests:  
          - not_null
          - unique
          
    data_tests:  
      - dbt_utils.unique_combination_of_columns:
          arguments: 
            combination_of_columns: 
              - sk_encounter_id
              