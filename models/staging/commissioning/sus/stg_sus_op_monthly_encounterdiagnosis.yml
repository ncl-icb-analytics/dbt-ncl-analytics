models:
  - name: stg_sus_op_monthly_encounterdiagnosis
    description: 'Encounter diagnosis from SUS data.
      One row per encounter diagnosis.
      '
    config:
      meta:
        owner:
          name: Poya Khalaj
    columns:
      - name: sk_encounter_id
        description: Encounter identifier forming part of the diagnosis grain.
        data_tests:
          - not_null
      - name: diagnosis_number
        description: Diagnosis sequence number forming part of the diagnosis grain.
        data_tests:
          - not_null

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - sk_encounter_id
              - diagnosis_number
