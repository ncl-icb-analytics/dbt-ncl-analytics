models:
  - name: stg_sus_op_monthly_encounterbillingattribution
    description: 'Encounter Billing Attributions from SUS data.

      One row per encounter.

      '
    config:
      meta:
        owner:
          name: Poya Khalaj
    columns:
      - name: sk_encounter_id
        description: Unique identifier for the appointment (SK_EncounterID)
        tests:
          - not_null
          - unique
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1