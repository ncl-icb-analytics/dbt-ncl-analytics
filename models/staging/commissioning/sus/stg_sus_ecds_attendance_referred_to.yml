version: 2

models:
  - name: stg_sus_ecds_attendance_referred_to
    description: >
      Services an ECDS attendance was referred to.
      Multiple rows per attendance, sequenced by referred_to_id.
      
    config:
      meta:
        owner:
          name: Poya Khalaj
    columns:
      - name: primarykey_id
        description: ECDS attendance identifier. Joins to stg_ecds_consolidated."Record_Identifier".
        tests:
          - not_null

      - name: referred_to_id
        description: Sequence identifier for this child record within the attendance.
        tests:
          - not_null
