models:
  - name: stg_sus_op_monthly_encounterbillingrepriced
    description: 'Encounter repriced billings from SUS data.
      One row per encounter and costing algorithm.
      '
    config:
      meta:
        owner:
          name: Poya Khalaj
    columns:
      - name: sk_encounter_id
        description: Encounter identifier forming part of the composite grain.
        data_tests:
          - not_null
      - name: sk_costing_algorithm_id
        description: Costing algorithm identifier forming part of the composite grain.
        data_tests:
          - not_null

    data_tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments: # 👈 Add the arguments block here to satisfy the modern parser
            min_value: 1

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - sk_encounter_id
              - sk_costing_algorithm_id
