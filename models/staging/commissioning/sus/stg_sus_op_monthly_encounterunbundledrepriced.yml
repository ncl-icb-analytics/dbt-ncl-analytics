models:
  - name: stg_sus_op_monthly_encounterunbundledrepriced
    description: 'Repriced unbundled activity from SUS data.
      One row per encounter and unbundled number.
      '
    config:
      meta:
        owner:
          name: Poya Khalaj
    columns:
      - name: sk_encounter_id
        description: Encounter identifier forming part of the unbundled grain.
        data_tests:
          - not_null
      - name: unbundled_no
        description: Unbundled sequence number forming part of the grain.
        data_tests:
          - not_null

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - sk_encounter_id
              - unbundled_no
