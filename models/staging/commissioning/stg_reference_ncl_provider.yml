
models:
  - name: stg_reference_ncl_provider
    description: NCL provider reference data with provider codes and reporting 
      hierarchies. One row per provider.
    config:
      meta:
        owner:
          name: PeterSNHS
    columns:
      - name: sk_organisation_id
        description: Surrogate key for the organisation
        data_tests:
          - unique
          - not_null
      - name: provider_code
        description: Provider ODS code
        data_tests:
          - not_null
