version: 2

models:
  - name: stg_ref
    description: |
      Community Referrals (REF) SDL feed, cleaned to the Community Referrals PLD
      layout. Grain: one row per source referral.

      Cleaning: best-populated provider-variant column picked per field; coded
      fields mapped to national code sets (local codes pass through, with text
      descriptions alongside); dates parsed; financial period from the stated
      value else the referral date else the file name; identifiers pseudonymised.

      Cumulative-restatement feed — summing double-counts; report from
      stg_ref_latest for the current statement per (provider, FY, month).
    config:
      meta:
        owner:
          name: Eddie Davison
    columns:
      - name: meta_sk_row_id
        description: Surrogate row key from the SDL pipeline.
        data_tests:
          - not_null
          - unique
      - name: meta_partition_date
        description: DSCRO monthly partition the file was loaded under.
      - name: dv_financial_year
        description: Financial year as 'YYYYYY' (e.g. 202526 = FY2025/26), matching the SLAM feeds; stated value or derived from referral date.
      - name: dv_financial_month
        description: Financial month 1 (April) - 12 (March); stated value or derived from referral date.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 12
                inclusive: true
      - name: dv_financial_period_source
        description: Provenance of the financial period - 'stated' (provider value), 'derived_from_referral_date', or 'derived_from_file_name'.
        data_tests:
          - accepted_values:
              arguments:
                values: ['stated', 'derived_from_referral_date', 'derived_from_file_name']
      - name: dlp_flex_or_freeze
        description: DLP submission flag standardised to 'Flex' or 'Freeze' (other values -> NULL).
        data_tests:
          - accepted_values:
              arguments:
                values: ['Flex', 'Freeze']
      - name: service_request_id
        description: Service request identifier, coalesced across referral-id siblings.
      - name: local_patient_id
        description: Local patient identifier, coalesced across provider sibling columns.
      - name: sk_patient_id
        description: Pseudonymised NHS-number-derived key (best-populated SK variant). ~82% populated.
      - name: dv_year_of_birth
        description: Year of birth (pseudonymised in lieu of full DOB).
      - name: lsoa
        description: LSOA of residence (derived; not a PLD spec field but high-value geography, ~74% populated).
      - name: site_of_treatment_code
        description: Site code of treatment (not a PLD spec field but useful location, ~67% populated).
      - name: gender_code
        description: Gender code (coalesced; GENDER carries the data on this feed).
      - name: gp_practice_code
        description: Registered GP practice ODS code (coalesced siblings; GP_PRACTICE_CODE is the best-populated, lifting fill ~7% -> 66%).
      - name: source_of_referral_description
        description: Source-of-referral text label (full Current spec field 17; ~68% populated, aids the code).
      - name: team_type_description
        description: Team referred-to text label (full Current spec; makes the mostly-local team_type_code usable; ~27% populated).
      - name: primary_referral_reason_description
        description: Referral reason text label (full Current spec; aids the code; ~33% populated).
      - name: referral_received_date
        description: Referral request received date (parsed). ~98% populated.
      - name: provider_code
        description: Provider ODS code, dictionary-cleaned, falling back to META_PROVIDER_CODE.
        data_tests:
          - not_null
