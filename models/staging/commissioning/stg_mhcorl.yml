version: 2

models:
  - name: stg_mhcorl
    description: |
      Cleaned MHCORL — the MHCORL feed in ServicesDataLocal (provider monthly
      mental-health activity submissions, originally spreadsheet uploads,
      remapped via the SDL pipeline). Single source, row-level cleanup (typing,
      normalisation, sibling-coalesce, gender/ethnicity reference mapping).

      Heavier than typical staging in this repo because the source is too
      inconsistent to expose to downstream int_/reporting layers as-is. Grain
      stays 1:1 with source. Materialised as table for query performance over
      the inline CASE/regex/coalesce chains.

      Scope: meta_partition_date >= 2022-04-01. See model SQL for the cutoff
      rationale. Raw values for gender / ethnicity etc. live in source.

      Coverage caveats:
        * RRP00 (CNWL, ~90% volume), RNK00 (NMUH), RAT00 (Whittington) are the
          only providers still submitting from 2024-04 onwards.
        * RV300 (RFL) stopped 2023-09. Smaller historic providers stopped earlier.
    config:
      meta:
        owner:
          name: Eddie Davison
    columns:
      - name: meta_sk_row_id
        description: Surrogate row key from the SDL pipeline.
        tests:
          - not_null
          - unique
      - name: meta_file_id
        description: SDL source file id. Trace back to Log_ProcessingEvent.
        tests:
          - not_null
      - name: meta_row_id
      - name: meta_batch_id
      - name: meta_partition_date
        description: Activity month (first day) from the SDL meta layer. Use this for time-series rollups.
        tests:
          - not_null
      - name: meta_provider_code
        description: ODS provider code populated by the SDL pipeline.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['RRP00', 'RNK00', 'RV300', 'RAT00', 'RKL00', 'RWK00', 'RV500', 'TAF00']
      - name: meta_recipient_code
        description: ODS recipient code (commissioner / DSCRO).
      - name: meta_version_id
        description: Schema-version id (md5 of source column headers) — identifies the file layout.

      - name: sk_patient_id
        description: |
          Pseudonymised NHS-number-derived patient hash. Matches sk_patient_id in
          stg_csds_*, stg_mhsds_*, stg_sus_*. Use for cross-dataset joins.
          Sourced from MHCORL.SK_PATIENT_ID_NHS_NUMBER.
        tests:
          - not_null:
              config:
                severity: warn
      - name: sk_patient_id_local_hash
        description: |
          DIFFERENT identifier — locally-derived hash (likely from hospital number).
          Zero overlap with sk_patient_id — DO NOT JOIN on this. Useful only for
          within-provider linking on RRP00/RNK00/RKL00.

      - name: reporting_month
        description: Month number 1-12.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 12
                inclusive: true
      - name: financial_year_start
        description: Calendar year the financial year starts (e.g. 2024 for FY24/25).
      - name: financial_year_canonical
        description: Financial year as 'YYYY-YY' (e.g. '2024-25').
      - name: financial_year_raw
        description: Original FY string from the most-populated sibling column. 7+ source formats observed.

      - name: referral_date
        description: Coalesced from referral_date / date_of_referral / dateofreferral, multi-format parsed.
      - name: contact_date
        description: |
          Coalesced from contact_date / contactdate / col_1_stf2_fcontactdatetime
          (RV300) / col_1st_f2_fcontact_date_time (RKL00). Multi-format parsed.
          NB RAT00 and RNK00 do not supply a contact date for 2022+.

      - name: gender
        description: |
          Canonicalised: Male / Female / Not specified / Not known / Indeterminate / Other.
          Source has 25+ raw variants per provider (1/2/M/F/Male/Female/...).
        tests:
          - accepted_values:
              arguments:
                values: ['Male', 'Female', 'Not specified', 'Not known', 'Indeterminate', 'Other']
      - name: ethnicity_17
        description: |
          NHS 17+1 ethnic category. Maps:
            * letter codes (A-Z, 99, 0) — used by RNK00, RAT00, RWK00
            * 'White - X' / 'Asian or Asian British - X' etc. prefixed forms — RRP00
            * bare names (British, Indian, Caribbean, ...) — RV300
          Aggregations that don't fit a single bucket (BME, NON BME) → NULL.
        tests:
          - accepted_values:
              arguments:
                values:
                  - 'White: British'
                  - 'White: Irish'
                  - 'White: Any other White background'
                  - 'Mixed: White and Black Caribbean'
                  - 'Mixed: White and Black African'
                  - 'Mixed: White and Asian'
                  - 'Mixed: Any other Mixed background'
                  - 'Asian or Asian British: Indian'
                  - 'Asian or Asian British: Pakistani'
                  - 'Asian or Asian British: Bangladeshi'
                  - 'Asian or Asian British: Any other Asian background'
                  - 'Black or Black British: Caribbean'
                  - 'Black or Black British: African'
                  - 'Black or Black British: Any other Black background'
                  - 'Other Ethnic Groups: Chinese'
                  - 'Other Ethnic Groups: Any other ethnic group'
                  - 'Not stated'
                  - 'Not known'
      - name: ethnicity_6
        description: |
          NHS 6 broad ethnicity grouping derived from the same letter code as
          ethnicity_17: White / Mixed / Asian or Asian British /
          Black or Black British / Other Ethnic Groups / Unknown.
        tests:
          - accepted_values:
              arguments:
                values:
                  - 'White'
                  - 'Mixed'
                  - 'Asian or Asian British'
                  - 'Black or Black British'
                  - 'Other Ethnic Groups'
                  - 'Unknown'
      - name: lsoa
        description: Pseudo LSOA (DV_LSOA from source).
      - name: partial_post_code
        description: Partial post code (DV_PARTIAL_POST_CODE from source).

      - name: provider_code
      - name: commissioner_code
      - name: commissioner_name
      - name: gp_practice_code
        description: Coalesced from gp_practice_code / general_practice_code / gppct_code.
      - name: gp_code
      - name: team_name
        description: Coalesced from team_name / lps_team_name / lpsteamname / team.
      - name: team_code
        description: Coalesced from team_code / lps_team_code.

      - name: flex_or_freeze
        description: Coalesced from flex_or_freeze / dlp_flexor_freeze.
      - name: finance_category
      - name: costing_code_description

      - name: source_of_referral
        description: Coalesced from source_of_referral / referral_source / referralsource.
      - name: consultation_medium
      - name: contact_type
        description: Coalesced from consultation_type / contact_type.
      - name: duration_of_contact_minutes
      - name: appointment_sequence_id

    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1000000
