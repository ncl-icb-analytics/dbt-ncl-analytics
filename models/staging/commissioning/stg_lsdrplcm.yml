version: 2

models:
  - name: stg_lsdrplcm
    description: |
      Cleaned SLAM high-cost drugs PLD (LSDrPLCM) — provider patient-level
      drug contract-monitoring submissions from ServicesDataLocal. Grain 1:1
      with DATA_LAKE.SDL.LSDRPLCM.

      Use dv_is_latest_submission = true to get the current provider statement
      of each (provider, FY, month). Cleaning conventions as stg_lsplcm.
    config:
      meta:
        owner:
          name: Eddie Davison
    columns:
      - name: meta_sk_row_id
        description: Surrogate row key from the SDL pipeline.
        data_tests:
          - not_null
          - unique
      - name: submission_loaded_at
        description: When ISL/OneLondon processed the file — the reliable submission ordering.
      - name: dv_financial_year
        description: Validated financial year as 'YYYYYY' (e.g. '202627'); see stg_lsplcm.
      - name: dv_financial_month
        description: Financial month 1 (April) - 12 (March). Junk values -> NULL.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 12
                inclusive: true
      - name: dv_provider_code
        description: Provider ODS code cleaned via dictionary lookup.
        data_tests:
          - not_null
      - name: sk_patient_id
        description: Pseudonymised NHS-number-derived patient hash; matches stg_sus_* convention.
      - name: drug_code_dmd
        description: dm+d (SNOMED CT) code of the high-cost tariff-excluded drug.
      - name: dv_total_cost
        description: TOTAL_COST as NUMBER(38,6). £/commas/'TBC' handled; sum-safe.
      - name: dv_unit_price_commissioner
        description: UNIT_PRICE_COMMISSIONER as NUMBER(38,6).
      - name: dv_is_latest_submission
        description: True for the most recent statement of each (provider, FY, month) slice.
        data_tests:
          - not_null
