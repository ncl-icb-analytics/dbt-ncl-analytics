models:
  - name: stg_myria_matched_patients
    description: Myria propensity-matched evaluation population (Barnet treatment + matched Enfield controls), passthrough of DATA_LAKE__NCL.MYRIA.MATCHED_PATIENTS. One row per patient per matching run; file_date identifies the run.
    config:
      meta:
        owner:
          name: KateHomer55
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [patient_id, file_date]
    columns:
      - name: patient_id
        description: Patient identifier, unique within a matching run.
        data_tests:
          - not_null
      - name: file_date
        description: Date of the matching run this row came from.
        data_tests:
          - not_null
