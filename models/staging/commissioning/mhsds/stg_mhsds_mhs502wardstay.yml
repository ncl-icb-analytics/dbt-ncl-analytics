models:
  - name: stg_mhsds_mhs502wardstay
    description: >
      One row per MHSDS ward stay, using the newest active submission in which
      it appears. The parent spell and referral are the most recently submitted
      links; superseded versions are not retained.
    config:
      meta:
        owner:
          name: Kate Homer
    columns:
      - name: uniq_serv_req_id
        description: Service request identifier recorded for the ward stay in its newest submission.
        data_tests:
          - not_null

      - name: person_id
        description: MHSDS person identifier.

      - name: org_id_prov
        description: Organisation identifier for the provider.

      - name: site_id_of_treat
        description: Provider site where the ward stay took place.

      - name: uniq_ward_stay_id
        description: Unique ward stay identifier within the provider.
        data_tests:
          - not_null
          - unique

      - name: hospital_bed_type_name
        description: Hospital bed type supplied in the MHSDS feed.

      - name: uniq_hosp_prov_spell_num
        description: Hospital provider spell containing the ward stay.
        data_tests:
          - not_null

      - name: dmic_ccg_code
        description: Commissioner code derived in the source feed.

      - name: uniq_submission_id
        description: Active submission supplying the retained ward stay version.

      - name: reporting_period_end_date
        description: >
          Reporting period recorded on the retained ward-stay record, which is
          the one from the newest accepted submission containing the ward stay.
        data_tests:
          - not_null

    data_tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
