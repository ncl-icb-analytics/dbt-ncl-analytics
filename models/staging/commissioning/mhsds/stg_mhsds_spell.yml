models:
  - name: stg_mhsds_spell
    description: >
      One row per MHSDS hospital provider spell from the newest active submission
      in which it appears. Attributes and the referral link are the most recently
      submitted version; superseded versions are not retained.
    config:
      meta:
        owner:
          name: Jessica Roberts
    columns:
      - name: uniq_hosp_prov_spell_num
        description: Unique hospital provider spell identifier within the provider.
        data_tests:
          - not_null
          - unique

      - name: dm_icb_commissioner
        description: ICB commissioner derived in the source feed.

      - name: reporting_period_end_date
        description: >
          Reporting period recorded on the retained spell record, which is the
          one from the newest accepted submission containing the spell. A
          historic value with no discharge date can indicate a spell that stopped
          being submitted without a recorded discharge.
        data_tests:
          - not_null

      - name: uniq_serv_req_id
        description: Service request identifier recorded for the spell in its newest submission.

      - name: age_hosp_start_date
        description: Age at admission derived in the MHSDS feed.

    data_tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
