version: 2

models:
  - name: stg_mhsds_patientindicators
    description: >
      MHSDS patient indicators, including child-protection and looked-after
      status. One row per provider-local patient, using the newest reporting
      period and then the latest received submission within that period.
    config:
      meta:
        owner:
          name: Eddie Davison
    columns:
      - name: mhs005_uniq_id
        description: Identifier of the selected source record.
        data_tests:
          - not_null
      - name: unique_local_patient_id
        description: Derived identifier for a provider-local patient.
        data_tests:
          - unique
          - not_null
      - name: person_id
        description: MHSDS person identifier.
      - name: cpp
        description: Child protection plan indicator.
      - name: lac_status
        description: Looked-after child status.
      - name: lac_legal_status
        description: Looked-after child legal status.
      - name: org_id_prov
        description: Provider organisation code.
      - name: uniq_submission_id
        description: Submission containing the retained patient status.
      - name: reporting_period_end_date
        description: End of the reporting period containing the retained status.
      - name: effective_from
        description: Time the retained source file was received.
