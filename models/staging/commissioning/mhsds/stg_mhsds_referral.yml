version: 2

models:
  - name: stg_mhsds_referral
    description: >-
      MHSDS referrals from active provider submissions. One row per unique
      service request. The newest effective record is retained, then the newest
      reporting period and submitted record resolve ties.
    config:
      meta:
        owner:
          name: Eddie Davison
    columns:
      - name: uniq_serv_req_id
        description: MHSDS unique service request identifier.
        data_tests: [not_null, unique]
      - name: mhs101_uniq_id
        description: Unique submitted MHS101 record identifier.
        data_tests: [not_null]
      - name: service_request_id
        description: Provider-local service request identifier.
      - name: person_id
        description: MHSDS person identifier.
      - name: referral_request_received_date
        description: Date the provider received the referral request.
      - name: referral_request_received_time
        description: Recorded time the provider received the referral request.
      - name: decision_to_treat_date
        description: Recorded decision-to-treat date.
      - name: decision_to_treat_time
        description: Recorded decision-to-treat time.
      - name: refer_rejection_date
        description: Recorded referral rejection date.
      - name: refer_rejection_time
        description: Recorded referral rejection time.
      - name: serv_disch_date
        description: Recorded service discharge date.
      - name: serv_disch_time
        description: Recorded service discharge time.
      - name: source_of_referral_mh
        description: Source-of-referral code.
      - name: prim_reason_referral_mh
        description: Primary reason for referral code.
      - name: clin_resp_priority_type
        description: Clinical response priority code.
      - name: org_id_prov
        description: Provider organisation code.
      - name: org_id_referring_org
        description: Referring organisation code.
      - name: care_prof_team_local_id
        description: Provider-local primary service or team identifier.
      - name: uniq_care_prof_team_local_id
        description: MHSDS-derived primary service or team identifier.
      - name: serv_team_type
        description: Primary service or team type code supplied in MHSDS v6.
      - name: dm_icb_commissioner
        description: Derived ICB commissioner code.
      - name: uniq_submission_id
        description: MHSDS submission identifier.
        data_tests: [not_null]
      - name: reporting_period_end_date
        description: End date of the source submission period.
      - name: dmic_dataset
        description: MHSDS version assigned by the source pipeline.
