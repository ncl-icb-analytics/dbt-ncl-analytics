version: 2

models:
  - name: stg_mhsds_servicetype
    description: >
      MHSDS service types for referral currency grouping. Grain: one row per
      uniq_serv_req_id. Population: referrals represented in MHS102. Time
      semantics: where a referral has more than one submitted service type, the
      latest submission is retained. DMIC derives serv_team_type_ref_to_mh onto
      MHS102 for v6 submissions, where it is populated for 99.95% of rows; no
      MHS101 v6 union is used.
    config:
      meta:
        owner:
          name: Eddie Davison
    columns:
      - name: uniq_serv_req_id
        description: Unique service request identifier.
        data_tests:
          - not_null
          - unique
      - name: person_id
        description: MHSDS person identifier.
      - name: serv_team_type_ref_to_mh
        description: Service team type referred to code.
      - name: serv_team_int_age_group
        description: Service team intended age group.
      - name: service_type_name
        description: Service type name.
      - name: org_id_prov
        description: Provider organisation code.
      - name: uniq_submission_id
        description: MHSDS submission identifier.
