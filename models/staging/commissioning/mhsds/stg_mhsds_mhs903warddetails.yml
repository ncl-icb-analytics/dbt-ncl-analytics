models:
  - name: stg_mhsds_mhs903warddetails
    description: >-
      MHSDS ward-detail rows from active submissions. The source can contain
      more than one definition for a ward within a submission; downstream joins
      must resolve that exception before joining by provider, submission and
      ward code.
    config:
      meta:
        owner:
          name: Kate Homer


    columns:
      - name: mhs903_uniq_id
        description: Identifier of the submitted ward-detail row.
        data_tests:
          - not_null
          - unique

      - name: ward_code
        description: Provider-local ward identifier.
        data_tests:
          - not_null

      - name: site_id_of_ward
        description: Organisation site identifier for the ward.

      - name: org_id_prov
        description: Provider organisation code.
        data_tests:
          - not_null

      - name: uniq_submission_id
        description: Submission containing the ward definition.
        data_tests:
          - not_null
             
      - name: dmic_ccg_code
        description: Commissioner code derived by the source pipeline.
