models:
  - name: stg_mhsds_mpi
    description: MHSDS Master Patient Index rows from accepted submissions.
    config:
      meta:
        owner:
          name: Kate Homer
    columns:
      - name: sk
        description: Source row identifier.
        data_tests:
          - unique
          - not_null

      - name: sk_patient_id
        description: Pseudonymised patient key.

      - name: person_id
        description: MHSDS person identifier.

      - name: local_patient_id
        description: Provider-local patient identifier.

      - name: org_id_prov
        description: Provider organisation code.

      - name: dmic_ccg_code
        description: Commissioner code derived by the source pipeline.

    data_tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
