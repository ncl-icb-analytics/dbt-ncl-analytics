models:
  - name: stg_mhsds_mpi
    description: >
      MHSDS Master Patient Index snapshots. Grain: one row per accepted
      submission and derived local patient identifier. Duplicate rows within a
      file use the last source row.
    config:
      meta:
        owner:
          name: Kate Homer
    columns:
      - name: sk
        description: Source row identifier.
        data_tests:
          - unique
          - not_null

      - name: sk_patient_id
        description: Pseudonymised patient key.

      - name: mhs001_uniq_id
        description: Identifier of the retained MHS001 source row.
        data_tests:
          - not_null

      - name: unique_local_patient_id
        description: Derived identifier for a provider-local patient.
        data_tests:
          - not_null

      - name: uniq_submission_id
        description: Submission containing the patient snapshot.
        data_tests:
          - not_null

      - name: reporting_period_end_date
        description: End of the snapshot reporting period.

      - name: person_id
        description: MHSDS person identifier.

      - name: local_patient_id
        description: Provider-local patient identifier.

      - name: org_id_prov
        description: Provider organisation code.

      - name: dmic_ccg_code
        description: Commissioner code derived by the source pipeline.

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [uniq_submission_id, unique_local_patient_id]
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
