version: 2

models:
  - name: stg_comopl
    description: |
      Cleaned Community Outpatient (COMOPL) — SDL contact-level community
      activity, projected to the Community SLAM PLD spec (Appendix 5a, 28
      fields). Grain 1:1 with DATA_LAKE.SDL.COMOPL (~94M rows).

      Fields resolve to the best-populated source column per fill-rate
      profiling (the spec-named columns are often sparse in this superset).
      Patient identifiers are pseudonymised (NHS Number = SK key, DOB = year,
      Postcode = partial) — an accepted deviation. A downstream view can rename
      to the exact spec field names and restrict columns.
    config:
      meta:
        owner:
          name: Eddie Davison
    columns:
      - name: meta_sk_row_id
        description: Surrogate row key from the SDL pipeline.
        data_tests:
          - not_null
          - unique
      - name: meta_partition_date
        description: DSCRO monthly partition the file was loaded under.
      - name: dv_financial_year
        description: Financial year as 'YYYYYY' (e.g. 202526 = FY2025/26), matching the SLAM feeds; stated value or derived from contact date.
      - name: dv_financial_month
        description: Financial month 1 (April) - 12 (March); stated value or derived from contact date.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 12
                inclusive: true
      - name: dv_financial_period_source
        description: Provenance of the financial period - 'stated' (provider value), 'derived_from_contact_date', or 'derived_from_file_name'.
        data_tests:
          - accepted_values:
              arguments:
                values: ['stated', 'derived_from_contact_date', 'derived_from_file_name']
      - name: dlp_flex_or_freeze
        description: DLP submission flag standardised to 'Flex' or 'Freeze' (other values -> NULL).
        data_tests:
          - accepted_values:
              arguments:
                values: ['Flex', 'Freeze']
      - name: local_patient_id
        description: Local patient identifier, coalesced across provider sibling columns.
      - name: sk_patient_id
        description: Pseudonymised NHS-number-derived key (SK_PATIENT_ID_NHS_NUMBER). ~98% populated.
      - name: dv_year_of_birth
        description: Year of birth (pseudonymised in lieu of full DOB).
      - name: gender_code
        description: Gender code (coalesced; GENDER carries the data on this feed).
      - name: provider_code
        description: Provider ODS code, dictionary-cleaned, falling back to META_PROVIDER_CODE.
        data_tests:
          - not_null
      - name: service_request_id
        description: Service request identifier (links activity to its referral).
