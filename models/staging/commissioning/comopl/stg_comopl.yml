version: 2

models:
  - name: stg_comopl
    description: |
      Community Outpatient (COMOPL) SDL feed, cleaned to the Community SLAM PLD
      layout. Grain: one row per source care contact.

      Cleaning: best-populated provider-variant column picked per field; coded
      fields mapped to national code sets (local codes pass through); dates and
      times parsed and combined into datetimes; financial period from the stated
      value else the contact date else the file name; identifiers pseudonymised.

      Cumulative-restatement feed — summing double-counts; report from
      stg_comopl_latest for the current statement per (provider, FY, month).
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      # Guard the "no dates misfiled as times" invariant: the time columns must
      # hold clock times (HH:MM[:SS]) or be NULL.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "contact_time is null or contact_time rlike '^[0-9]{1,2}:[0-9]{2}.*'"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "referral_received_time is null or referral_received_time rlike '^[0-9]{1,2}:[0-9]{2}.*'"
    columns:
      - name: meta_sk_row_id
        description: Surrogate row key from the SDL pipeline.
        data_tests:
          - not_null
          - unique
      - name: meta_partition_date
        description: DSCRO monthly partition the file was loaded under.
      - name: dv_financial_year
        description: Financial year as 'YYYYYY' (e.g. 202526 = FY2025/26), matching the SLAM feeds; stated value or derived from contact date.
      - name: dv_financial_month
        description: Financial month 1 (April) - 12 (March); stated value or derived from contact date.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 12
                inclusive: true
      - name: dv_financial_period_source
        description: Provenance of the financial period - 'stated' (provider value), 'derived_from_contact_date', or 'derived_from_file_name'.
        data_tests:
          - accepted_values:
              arguments:
                values: ['stated', 'derived_from_contact_date', 'derived_from_file_name']
          # Nulls are expected (rows with no resolvable period); warn so the
          # unresolved count is surfaced and tracked, not failed.
          - not_null:
              config:
                severity: warn
      - name: dlp_flex_or_freeze
        description: DLP submission flag standardised to 'Flex' or 'Freeze' (other values -> NULL).
        data_tests:
          - accepted_values:
              arguments:
                values: ['Flex', 'Freeze']
      - name: local_patient_id
        description: Local patient identifier, coalesced across provider sibling columns.
      - name: sk_patient_id
        description: Pseudonymised NHS-number-derived key (SK_PATIENT_ID_NHS_NUMBER). ~98% populated.
      - name: dv_year_of_birth
        description: Year of birth (pseudonymised in lieu of full DOB).
      - name: lsoa
        description: LSOA of residence (derived; not a PLD spec field but high-value geography, ~89% populated).
      - name: gender_code
        description: Gender code (coalesced across provider-variant siblings; ~98% populated, 100% national-code conformant).
        data_tests:
          # Provider feeds are volatile - warn (not fail) if a new variant the
          # gender map doesn't normalise appears.
          - accepted_values:
              arguments:
                values: ['1', '2', '9', 'X']
              config:
                severity: warn
      - name: ethnic_category_code
        description: NHS ethnic category national code (free-text variants mapped via nhs_ethnicity_category_code; unmappable -> NULL).
        data_tests:
          - accepted_values:
              arguments:
                values: ['A','B','C','D','E','F','G','H','J','K','L','M','N','P','R','S','Z','99','0']
              config:
                severity: warn
      - name: provider_code
        description: Provider ODS code, dictionary-cleaned, falling back to META_PROVIDER_CODE.
        data_tests:
          - not_null
      - name: service_request_id
        description: Service request identifier (links activity to its referral).
      - name: site_of_treatment_code
        description: Site code of treatment (full Current spec field 42; ~42% populated).
      - name: community_care_contact_identifier
        description: Community care contact identifier (full Current spec field 33; ~35% populated).
      - name: contact_duration_minutes
        description: Clinical contact duration in minutes (full Current spec; numeric, ~30% populated).
      - name: referral_received_time
        description: Referral request received time (clock time only; dates misfiled here are excluded and recovered into referral_received_date).
      - name: dv_referral_received_at
        description: Referral request received datetime, combining referral_received_date + referral_received_time (date at midnight where time absent).
      - name: contact_time
        description: Care contact time (clock time only; misfiled dates excluded and recovered into contact_date).
      - name: dv_contact_at
        description: Care contact datetime, combining contact_date + contact_time (date at midnight where time absent).
