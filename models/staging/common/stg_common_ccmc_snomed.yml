models:
  - name: stg_common_ccmc_snomed
    description: |
      Staging wrapper for the CCMS SNOMED codelist
      (DATA_LAKE__NCL.COMMON.CCMC_SNOMED). Used by the in-house CCMS pipeline
      under modelling/olids/risk_stratification.
      Migrated from stg_aic_base_ccms_snomed_codes (AIC_DEV.BASE_CCMS_SNOMED_CODES).
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: conditionid
        description: CCMS condition identifier.
        tests:
          - not_null
      - name: conditionname
        description: CCMS condition name.
      - name: conceptid
        description: SNOMED concept code mapped to the condition.
        tests:
          - not_null
      - name: primaryterm
        description: SNOMED preferred term for the concept.
