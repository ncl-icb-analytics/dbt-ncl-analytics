models:
  - name: stg_c_ltcs_cltcs_local_mapping_nh_gp
    description: "Operational local mapping of neighbourhoods to GP practices for C-LTCS and Haringery test bed."
    config:
      meta:
        owner:
          name: Emily Baldwin

    columns:
      - name: practice_name
        data_type: varchar
        description: "GP practice name"

      - name: practice_code
        data_type: varchar
        description: "GP practice ODS code"
        tests:
        - unique
        - not_null

      - name: neighbourhood_code
        data_type: varchar
        description: "Neighbourhood code from NCL, remapped to Haringey test bed neighbourhood code"

      - name: neighbourhood_registered
        data_type: varchar
        description: "Neighbourhood registered name from NCL"

      - name: local_authority
        data_type: varchar
        description: "Local authority from NCL"
