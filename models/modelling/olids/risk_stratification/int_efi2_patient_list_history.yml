models:
  - name: int_efi2_patient_list_history
    description: >-
      Monthly eFI2 population. One row represents one active, living person
      aged at least 65 at one of the last 60 completed month-ends. Age uses the
      first day of the approximate birth month, matching the current eFI2
      eligibility rule.
    config:
      meta:
        owner:
          name: em-baldwin
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [person_id, end_date]
    columns:
      - name: person_id
        description: Person identifier.
        data_tests:
          - not_null
      - name: end_date
        description: Completed month-end used as the scoring date.
        data_tests:
          - not_null
      - name: gender
        description: Gender normalised for eFI2 rules.
      - name: date_of_birth
        description: Approximate birth date.
      - name: date_of_death
        description: Approximate death date where recorded.
