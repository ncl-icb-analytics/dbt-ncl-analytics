models:
  - name: int_sickle_cell_or_thalassaemia_diagnoses_all
    description: 'Sickle cell disease and thalassaemia diagnosis observations for haematology register management.

      One row per observation using SICKLE_COD (sickle cell disease) and THAL_COD (thalassaemia) clusters.
      No resolution codes — both are lifelong inherited haemoglobinopathies. A person qualifies via either condition.'
    config:
      meta:
        owner:
          name: Eddie Davison
    columns:
      - name: id
        description: 'Unique identifier for the clinical observation'
        tests:
          - unique
          - not_null

      - name: person_id
        description: 'Patient identifier'

      - name: clinical_effective_date
        description: 'Date when the observation was clinically effective'

      - name: date_recorded
        description: 'Date the observation was recorded in the source system'

      - name: concept_code
        description: 'Clinical code for the sickle cell or thalassaemia diagnosis'

      - name: concept_display
        description: 'Human-readable description of the clinical code'

      - name: source_cluster_id
        description: 'Cluster identifier (SICKLE_COD or THAL_COD)'

      - name: is_diagnosis_code
        description: 'Flag indicating a diagnosis code (always TRUE)'

      - name: is_sickle_code
        description: 'Flag indicating a sickle cell disease diagnosis code (SICKLE_COD cluster)'

      - name: is_thalassaemia_code
        description: 'Flag indicating a thalassaemia diagnosis code (THAL_COD cluster)'

      - name: sickle_or_thalassaemia_observation_type
        description: 'Categorised observation type (Sickle Cell Disease Diagnosis or Thalassaemia Diagnosis)'

    tests:
      - dbt_utils.at_least_one:
          column_name: id
      - cluster_ids_exist:
          arguments:
            cluster_ids: SICKLE_COD, THAL_COD
