version: 2
models:
  - name: int_ltc_lcs_rs_ast_pg3_mr
    description: |
      Asthma Adult Register Priority Group 3 - Medium Risk.
      Excludes PG1 (HRC) and PG2 (HR). Parent population is the asthma
      register restricted to age >= 18 (EMIS 'LTC LCS: Asthma Adult Register*').

      Patients meeting any of:
      - Rule 2: acute exacerbation of asthma code in last 12 months
      - Rule 3: prednisolone order in last 12 months
      - Rule 4: antibiotics order in last 12 months
      - Rule 5: SABA order in last 12 months
      - Rule 6: LABA in last 6 months without ICS in last 6 months
      - Rule 7: SABA in last 12 months without ICS in last 6 months
        (subsumed by rule 5 in the R5 XML, kept for fidelity)

      The R5 EMIS XML has no issue-count restrictions (the GitHub issue text
      mentions >= 2 antibiotics / >= 6 SABA / >= 3 SABA).
    config:
      meta:
        owner:
          name: Eddie Davison
    data_tests:
      - dbt_utils.at_least_one:
          arguments:
            column_name: person_id
      - valuesets_have_codes:
          arguments:
            valuesets:
              - on_asthma_adult_reg_pg3_mr_vs1
              - on_asthma_adult_reg_pg3_mr_vs2
              - on_asthma_adult_reg_pg3_mr_vs3
              - on_asthma_adult_reg_pg3_mr_vs4
              - on_asthma_adult_reg_pg3_mr_vs5
              - on_asthma_adult_reg_pg3_mr_vs6
              - on_asthma_adult_reg_pg3_mr_vs7
    columns:
      - name: person_id
        data_tests:
          - not_null
          - unique
