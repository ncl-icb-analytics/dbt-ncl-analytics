models:
  - name: int_segmentation_op_activity
    description: >
      Outpatient activity blocks for segmentation, rolling 12 months ending
      on the latest attended appointment date (lag-aware). One row per
      sk_patient_id with any qualifying attended activity.

      paediatric_op_appointments_12mo counts attended appointments under a
      paediatric treatment function (paediatric_treatment_function_codes
      seed). outpatient_specialties_12mo counts distinct main specialties,
      excluding trauma & orthopaedics (110), ENT (120), ophthalmology (130)
      and A&E (180), aligned to the previously clinically agreed NWL cohort.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: sk_patient_id
        description: Pseudonymised patient key
        data_tests:
          - unique
          - not_null
      - name: paediatric_op_appointments_12mo
        description: Attended paediatric outpatient appointments in the window
        data_tests:
          - not_null
      - name: outpatient_specialties_12mo
        description: Distinct main specialties with an attended appointment in
          the window, after exclusions
        data_tests:
          - not_null
