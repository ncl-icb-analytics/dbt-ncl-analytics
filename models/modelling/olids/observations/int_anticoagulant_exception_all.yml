models:
  - name: int_anticoagulant_exception_all
    description: >
      Records that limit oral anticoagulant or DOAC treatment, from the PCD
      clusters for anticoagulant contraindication (TXORANTICOAG_COD,
      TXORANTICOAGGENCON_COD), anticoagulant declined (ORANTICOAGDEC_COD), DOAC
      contraindicated (DOACCON_COD), DOAC declined (DOACDEC_COD) and DOAC not
      indicated (DOACNI_COD). One row per observation for all people including
      inactive and deceased; observations dated after the build date are
      excluded. A code in more than one cluster appears once per cluster.
      Consumers decide which types persist and which expire.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: TXORANTICOAG_COD, TXORANTICOAGGENCON_COD, ORANTICOAGDEC_COD, DOACCON_COD, DOACDEC_COD, DOACNI_COD
            source: PCD
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - id
              - source_cluster_id
    columns:
      - name: id
        description: Source observation identifier; one row per observation and cluster.
        data_tests:
          - not_null
      - name: person_id
        description: Person identifier.
      - name: clinical_effective_date
        description: Date of the record.
      - name: exception_type
        description: ANTICOAGULANT_CONTRAINDICATED, ANTICOAGULANT_DECLINED, DOAC_CONTRAINDICATED, DOAC_DECLINED or DOAC_NOT_INDICATED.
        data_tests:
          - not_null
      - name: concept_code
        description: SNOMED code of the record.
      - name: concept_display
        description: Description of the record.
      - name: source_cluster_id
        description: PCD cluster that matched the code.
