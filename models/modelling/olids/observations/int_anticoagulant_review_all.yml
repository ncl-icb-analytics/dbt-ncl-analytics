models:
  - name: int_anticoagulant_review_all
    description: >
      Anticoagulant medication review records from the PCD cluster
      ORANTICOAGREVW_COD, one row per observation for all people including
      inactive and deceased. Observations dated after the build date are
      excluded. Feeds the NICE anticoagulation review indicator.
    config:
      meta:
        owner:
          name: EddieDavison92
    data_tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: ORANTICOAGREVW_COD
            source: PCD
    columns:
      - name: id
        description: Source observation identifier.
        data_tests:
          - unique
          - not_null
      - name: person_id
        description: Person identifier.
      - name: clinical_effective_date
        description: Date of the review record.
      - name: concept_code
        description: SNOMED code of the record.
      - name: concept_display
        description: Description of the record.
      - name: source_cluster_id
        description: Always ORANTICOAGREVW_COD.
