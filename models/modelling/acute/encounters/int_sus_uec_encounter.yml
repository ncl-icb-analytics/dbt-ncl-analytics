
models:
  - name: int_sus_uec_encounter
    description: "Event history for emergency encounters from SUS data. More information: https://digital.nhs.uk/data-and-information/data-collections-and-data-sets/data-sets/emergency-care-data-set-ecds/ecds-guidance"
    config:
      meta:
        owner:
          name: Emily Baldwin
    columns:
      - name: visit_occurrence_id
        data_type: number
        description: "Primary key for the encounter within SUS"
        data_tests:
          - unique
          - not_null

      - name: sk_patient_id
        data_type: varchar
        description: "Common commissioning patient identifier"

      - name: source
        data_type: varchar
        description: "Commissioning data source"

      - name: local_patient_identifier
        data_type: varchar
        description: "Trust-provided patient id."

      - name: cds_unique_identifier
        data_type: varchar
        description: "Identifier assigned to the submitted CDS transaction; retained for source traceability and reconciliation, not as the encounter grain."

      - name: provider_reference_number
        data_type: varchar
        description: "Provider reference number from the commissioning service agreement attached to the attendance."

      - name: organisation_id
        data_type: varchar
        description: "Organisation ID (type 41) of the provider, if invalid code trimmed to 3 characters"

      - name: organisation_name
        data_type: varchar
        description: "Provider organisation name"

      - name: site_id
        data_type: varchar
        description: "Site identifier"

      - name: site_name
        data_type: varchar
        description: "Site name"

      - name: pod
        data_type: varchar
        description: "Point of delivery category of the provider e.g. A&E, SDEC etc."

      - name: department_type
        data_type: varchar
        description: "Point of delivery code of the provider e.g. A&E, SDEC etc."

      - name: start_date
        data_type: date
        description: "Date of arrival at urgent care department"

      - name: start_time
        data_type: time
        description: "Time of arrival at urgent care department"

      - name: end_date
        data_type: date
        description: "Date of departure at urgent care department"

      - name: end_time
        data_type: time
        description: "Time of departure at urgent care department"

      - name: duration
        data_type: number
        description: "Time to urgent care department discharge from arrival, in minutes"

      - name: initial_assessment_date
        data_type: date
        description: "Date of the first formal clinical assessment in the emergency care attendance."

      - name: initial_assessment_time
        data_type: time
        description: "Time of the first formal clinical assessment in the emergency care attendance."

      - name: initial_assessment_time_since_arrival
        data_type: number
        description: "Source-reported elapsed time from arrival to initial assessment, in minutes."

      - name: seen_for_treatment_date
        data_type: date
        description: "Date the patient was first seen by a clinical professional for treatment."

      - name: seen_for_treatment_time
        data_type: time
        description: "Time the patient was first seen by a clinical professional for treatment."

      - name: seen_for_treatment_time_since_arrival
        data_type: number
        description: "Source-reported elapsed time from arrival until first seen for treatment, in minutes."

      - name: conclusion_date
        data_type: date
        description: "Date the clinical attendance was concluded. This is a clinical decision point and may precede end_date, when the patient physically left the department."

      - name: conclusion_time
        data_type: time
        description: "Time the clinical attendance was concluded. This may precede end_time, when the patient physically left the department."

      - name: conclusion_time_since_arrival
        data_type: number
        description: "Source-reported elapsed time from arrival to clinical conclusion, in minutes; distinct from duration, which runs to departure."

      - name: decided_to_admit_date
        data_type: date
        description: "Date the decision was made to admit the patient from emergency care."

      - name: decided_to_admit_time
        data_type: time
        description: "Time the decision was made to admit the patient from emergency care."

      - name: decided_to_admit_time_since_arrival
        data_type: number
        description: "Source-reported elapsed time from arrival to the decision to admit, in minutes."

      - name: clinically_ready_to_proceed_at
        data_type: timestamp_tz
        description: "First timestamp at which an authorised care professional decided that the patient no longer required ongoing emergency-department care."

      - name: clinically_ready_to_proceed_time_since_arrival
        data_type: number
        description: "Source-reported elapsed time from arrival until clinically ready to proceed, in minutes."

      - name: chief_complaint_code
        data_type: varchar
        description: "Chief complaint code of patient for the encounter"

      - name: chief_complaint_desc
        data_type: varchar
        description: "Chief complaint SNOMED description of patient for the encounter"

      - name: chief_complaint_ecds_group1
        data_type: varchar
        description: "Chief complaint ECDS group 1 description of patient for the encounter"

      - name: is_injury_related
        data_type: boolean
        description: "Flag for an injury related encounter"

      - name: acuity
        data_type: varchar
        description: "Clinical acuity code of the encounter"

      - name: injury_intent_code
        data_type: varchar
        description: "SNOMED CT code describing the intent associated with the injury."

      - name: injury_intent_desc
        data_type: varchar
        description: "Human-readable UK preferred term for the injury intent code."

      - name: injury_mechanism_code
        data_type: varchar
        description: "SNOMED CT code describing the mechanism that caused the injury."

      - name: injury_mechanism_desc
        data_type: varchar
        description: "Human-readable UK preferred term for the injury mechanism code."

      - name: place_of_injury_code
        data_type: varchar
        description: "SNOMED CT code describing the type of place where the injury occurred."

      - name: place_of_injury_desc
        data_type: varchar
        description: "Human-readable UK preferred term for the place-of-injury code."

      - name: injury_date
        data_type: date
        description: "Date on which the injury occurred, as recorded for the attendance."

      - name: injury_time
        data_type: time
        description: "Time at which the injury occurred, as recorded for the attendance."

      - name: disease_notification_code
        data_type: varchar
        description: "ECDS disease-notification code recorded for the attendance."

      - name: primary_diagnosis_code_snomed
        data_type: varchar
        description: "The first listed diagnosis SNOMED code, considered to be the most important / significant."

      - name: primary_diagnosis_desc_snomed
        data_type: varchar
        description: "The first listed diagnosis SNOMED description, considered to be the most important / significant."

      - name: primary_diagnosis_code_icd10
        data_type: varchar
        description: "The first listed diagnosis ICD-10 code, considered to be the most important / significant."

      - name: primary_diagnosis_desc_icd10
        data_type: varchar
        description: "The first listed diagnosis ICD-10 description, considered to be the most important / significant."

      - name: primary_diagnosis_desc_ecds_group1
        data_type: varchar
        description: "The first listed diagnosis ECDS group 1 description, considered to be the most important / significant."

      - name: secondary_diagnosis_1_code_snomed
        data_type: varchar
        description: "SNOMED CT diagnosis code recorded at source diagnosis sequence position 2."
      - name: secondary_diagnosis_2_code_snomed
        data_type: varchar
        description: "SNOMED CT diagnosis code recorded at source diagnosis sequence position 3."
      - name: secondary_diagnosis_3_code_snomed
        data_type: varchar
        description: "SNOMED CT diagnosis code recorded at source diagnosis sequence position 4."
      - name: secondary_diagnosis_4_code_snomed
        data_type: varchar
        description: "SNOMED CT diagnosis code recorded at source diagnosis sequence position 5."
      - name: secondary_diagnosis_5_code_snomed
        data_type: varchar
        description: "SNOMED CT diagnosis code recorded at source diagnosis sequence position 6."
      - name: secondary_diagnosis_6_code_snomed
        data_type: varchar
        description: "SNOMED CT diagnosis code recorded at source diagnosis sequence position 7."
      - name: secondary_diagnosis_7_code_snomed
        data_type: varchar
        description: "SNOMED CT diagnosis code recorded at source diagnosis sequence position 8."
      - name: secondary_diagnosis_8_code_snomed
        data_type: varchar
        description: "SNOMED CT diagnosis code recorded at source diagnosis sequence position 9."
      - name: secondary_diagnosis_9_code_snomed
        data_type: varchar
        description: "SNOMED CT diagnosis code recorded at source diagnosis sequence position 10."
      - name: secondary_diagnosis_10_code_snomed
        data_type: varchar
        description: "SNOMED CT diagnosis code recorded at source diagnosis sequence position 11."
      - name: secondary_diagnosis_11_code_snomed
        data_type: varchar
        description: "SNOMED CT diagnosis code recorded at source diagnosis sequence position 12."
      - name: secondary_diagnosis_12_code_snomed
        data_type: varchar
        description: "SNOMED CT diagnosis code recorded at source diagnosis sequence position 13."

      - name: primary_treatment
        data_type: varchar
        description: "First treatment SNOMED code recorded in encounter"

      - name: primary_treatment_desc_snomed
        data_type: varchar
        description: "First treatment SNOMED description recorded in encounter"

      - name: primary_treatment_desc_ecds_group1
        data_type: varchar
        description: "First treatment ECDS group 1 description recorded in encounter"

      - name: treatment_1_code_snomed
        data_type: varchar
        description: "SNOMED CT treatment code recorded at source sequence position 1."
      - name: treatment_2_code_snomed
        data_type: varchar
        description: "SNOMED CT treatment code recorded at source sequence position 2."
      - name: treatment_3_code_snomed
        data_type: varchar
        description: "SNOMED CT treatment code recorded at source sequence position 3."
      - name: treatment_4_code_snomed
        data_type: varchar
        description: "SNOMED CT treatment code recorded at source sequence position 4."
      - name: treatment_5_code_snomed
        data_type: varchar
        description: "SNOMED CT treatment code recorded at source sequence position 5."
      - name: treatment_6_code_snomed
        data_type: varchar
        description: "SNOMED CT treatment code recorded at source sequence position 6."
      - name: treatment_7_code_snomed
        data_type: varchar
        description: "SNOMED CT treatment code recorded at source sequence position 7."
      - name: treatment_8_code_snomed
        data_type: varchar
        description: "SNOMED CT treatment code recorded at source sequence position 8."
      - name: treatment_9_code_snomed
        data_type: varchar
        description: "SNOMED CT treatment code recorded at source sequence position 9."
      - name: treatment_10_code_snomed
        data_type: varchar
        description: "SNOMED CT treatment code recorded at source sequence position 10."
      - name: treatment_11_code_snomed
        data_type: varchar
        description: "SNOMED CT treatment code recorded at source sequence position 11."
      - name: treatment_12_code_snomed
        data_type: varchar
        description: "SNOMED CT treatment code recorded at source sequence position 12."

      - name: primary_investigation
        data_type: varchar
        description: "First investigation SNOMED code recorded in encounter"

      - name: primary_investigation_desc_snomed
        data_type: varchar
        description: "First investigation SNOMED description recorded in encounter"

      - name: primary_investigation_desc_ecds_group1
        data_type: varchar
        description: "First investigation ECDS group 1 description recorded in encounter"

      - name: clinical_investigation_1_code_snomed
        data_type: varchar
        description: "SNOMED CT investigation code recorded at source sequence position 1."
      - name: clinical_investigation_2_code_snomed
        data_type: varchar
        description: "SNOMED CT investigation code recorded at source sequence position 2."
      - name: clinical_investigation_3_code_snomed
        data_type: varchar
        description: "SNOMED CT investigation code recorded at source sequence position 3."
      - name: clinical_investigation_4_code_snomed
        data_type: varchar
        description: "SNOMED CT investigation code recorded at source sequence position 4."
      - name: clinical_investigation_5_code_snomed
        data_type: varchar
        description: "SNOMED CT investigation code recorded at source sequence position 5."
      - name: clinical_investigation_6_code_snomed
        data_type: varchar
        description: "SNOMED CT investigation code recorded at source sequence position 6."
      - name: clinical_investigation_7_code_snomed
        data_type: varchar
        description: "SNOMED CT investigation code recorded at source sequence position 7."
      - name: clinical_investigation_8_code_snomed
        data_type: varchar
        description: "SNOMED CT investigation code recorded at source sequence position 8."
      - name: clinical_investigation_9_code_snomed
        data_type: varchar
        description: "SNOMED CT investigation code recorded at source sequence position 9."
      - name: clinical_investigation_10_code_snomed
        data_type: varchar
        description: "SNOMED CT investigation code recorded at source sequence position 10."
      - name: clinical_investigation_11_code_snomed
        data_type: varchar
        description: "SNOMED CT investigation code recorded at source sequence position 11."
      - name: clinical_investigation_12_code_snomed
        data_type: varchar
        description: "SNOMED CT investigation code recorded at source sequence position 12."

      - name: comorbidity_1_code_snomed
        data_type: varchar
        description: "SNOMED CT comorbidity code recorded at source sequence position 1."
      - name: comorbidity_2_code_snomed
        data_type: varchar
        description: "SNOMED CT comorbidity code recorded at source sequence position 2."
      - name: comorbidity_3_code_snomed
        data_type: varchar
        description: "SNOMED CT comorbidity code recorded at source sequence position 3."
      - name: comorbidity_4_code_snomed
        data_type: varchar
        description: "SNOMED CT comorbidity code recorded at source sequence position 4."
      - name: comorbidity_5_code_snomed
        data_type: varchar
        description: "SNOMED CT comorbidity code recorded at source sequence position 5."
      - name: comorbidity_6_code_snomed
        data_type: varchar
        description: "SNOMED CT comorbidity code recorded at source sequence position 6."
      - name: comorbidity_7_code_snomed
        data_type: varchar
        description: "SNOMED CT comorbidity code recorded at source sequence position 7."
      - name: comorbidity_8_code_snomed
        data_type: varchar
        description: "SNOMED CT comorbidity code recorded at source sequence position 8."
      - name: comorbidity_9_code_snomed
        data_type: varchar
        description: "SNOMED CT comorbidity code recorded at source sequence position 9."
      - name: comorbidity_10_code_snomed
        data_type: varchar
        description: "SNOMED CT comorbidity code recorded at source sequence position 10."

      - name: arrival_mode_code
        data_type: varchar
        description: "Arrival mode SNOMED code"

      - name: arrival_mode_desc
        data_type: varchar
        description: "Arrival mode SNOMED description"

      - name: attendance_category_code
        data_type: varchar
        description: "ECDS attendance category: 1 unplanned first; 2 unplanned follow-up at this service; 3 unplanned follow-up at another service; 4 planned follow-up at this service; X dead on arrival."

      - name: attendance_category_desc
        data_type: varchar
        description: "Human-readable description of the ECDS attendance category code."

      - name: is_arrival_planned
        data_type: boolean
        description: "Whether arrival at the emergency care department was planned."

      - name: ambulance_incident_number
        data_type: varchar
        description: "Ambulance-service incident number associated with the attendance; linkage depends on the supplying ambulance dataset and identifier coverage."

      - name: conveying_ambulance_trust_code
        data_type: varchar
        description: "Cleaned organisation code of the ambulance trust that conveyed the patient."

      - name: conveying_ambulance_trust_name
        data_type: varchar
        description: "Human-readable name of the conveying ambulance trust."

      - name: ambulance_care_contact_identifier
        data_type: varchar
        description: "Ambulance care-contact identifier associated with the attendance; linkage depends on the supplying ambulance dataset and identifier coverage."

      - name: attendance_source_code
        data_type: varchar
        description: "SNOMED CT code identifying the source that referred or directed the patient to emergency care."

      - name: attendance_source_desc
        data_type: varchar
        description: "Human-readable UK preferred term for the attendance source code."

      - name: attendance_source_organisation_site_identifier
        data_type: varchar
        description: "Normalised organisation-site identifier for the source of the attendance, where supplied."

      - name: attendance_source_organisation_site_name
        data_type: varchar
        description: "Human-readable name of the source organisation site, where the identifier matches the organisation dictionary."

      - name: discharge_destination_code
        data_type: varchar
        description: "Discharge destination SNOMED code"

      - name: discharge_destination_desc
        data_type: varchar
        description: "Discharge destination SNOMED description"

      - name: discharge_status_code
        data_type: varchar
        description: "SNOMED CT code describing the patient's status at discharge from emergency care."

      - name: discharge_status_desc
        data_type: varchar
        description: "Human-readable UK preferred term for the discharge status code."

      - name: discharge_follow_up_code
        data_type: varchar
        description: "SNOMED CT code describing follow-up arranged following discharge from emergency care."

      - name: discharge_follow_up_desc
        data_type: varchar
        description: "Human-readable UK preferred term for the discharge follow-up code."

      - name: discharge_information_given_code
        data_type: varchar
        description: "ECDS code describing the discharge information provided to the patient."

      - name: decided_to_admit_treatment_function_code
        data_type: varchar
        description: "Treatment function code associated with the decision to admit."

      - name: decided_to_admit_treatment_function_desc
        data_type: varchar
        description: "Human-readable description of the treatment function associated with the decision to admit."

      - name: receiving_site_id
        data_type: varchar
        description: "Normalised identifier of the site expected to receive the patient following the decision to admit."

      - name: receiving_site_name
        data_type: varchar
        description: "Human-readable name of the site expected to receive the patient following the decision to admit."

      - name: main_specialty_code
        data_type: varchar
        description: "Allocated specialty code for the attendance: 180, emergency medicine"

      - name: main_specialty_name
        data_type: varchar
        description: "Allocated specialty name for the attendance: Emergency Medicine"

      - name: hrg_code
        data_type: varchar
        description: "Health resource group code associated with the encounter"

      - name: core_hrg_desc
        data_type: varchar
        description: "HRG description associated with the encounter"

      - name: core_hrg_chapter
        data_type: varchar
        description: "HRG chapter key associated with the encounter"

      - name: core_hrg_chapter_desc
        data_type: varchar
        description: "HRG chapter description associated with the encounter"

      - name: cost
        data_type: number
        description: "SUS listed cost associated with the encounter"

      - name: applicable_costing_period
        data_type: varchar
        description: "National-pricing costing period supplied for the attendance."

      - name: residence_commissioner_code_at_event
        data_type: varchar
        description: "Commissioner code derived from the patient's residence postcode at the time of the attendance."

      - name: residence_commissioner_name_at_event
        data_type: varchar
        description: "Human-readable name of the residence-derived commissioner at the time of the attendance."

      - name: registrant_commissioner_code_at_event
        data_type: varchar
        description: "Commissioner recorded on the commissioning service agreement for the attendance; distinct from the residence-derived commissioner."

      - name: registrant_commissioner_name_at_event
        data_type: varchar
        description: "Human-readable name of the commissioner recorded on the commissioning service agreement."

      - name: age_at_event
        data_type: number
        description: "Patient age at arrival"

      - name: patient_type_code
        data_type: varchar
        description: "Source ECDS patient-type code recorded at the attendance, such as ADU or CHI."

      - name: patient_type_desc
        data_type: varchar
        description: "Human-readable patient type, with ADU represented as Adult and CHI as Child."

      - name: gender_at_event
        data_type: varchar
        description: "The gender of a person as specified by the person or inferred by observation."

      - name: gender_desc_at_event
        data_type: varchar
        description: "Patient gender description at time of event"

      - name: ethnicity_at_event
        data_type: varchar
        description: "The ethnicity of a person, as specified by the person."

      - name: ethnicity_desc_at_event
        data_type: varchar
        description: "Patient ethnicity description at time of event"

      - name: postcode_district_at_event
        data_type: varchar
        description: "Patient postcode district at time of event"

      - name: lsoa_11_at_event
        data_type: varchar
        description: "Patient LSOA 2011 at time of event"

      - name: lad_at_event
        data_type: varchar
        description: "Patient local authority district at time of event"

      - name: imd_at_event
        data_type: varchar
        description: "Patient index of multiple deprivation decile at time of event"

      - name: reg_practice_at_event
        data_type: varchar
        description: "Patient registered GP practice at time of event"

      - name: general_practitioner_code
        data_type: varchar
        description: "Code of the individual general practitioner recorded for the patient; distinct from reg_practice_at_event, which identifies the GP practice."

      - name: visit_occurrence_type
        data_type: varchar
        description: "Type of visit occurrence"

      - name: patient_pathway_identifier
        data_type: varchar
        description: "Pseudonymised patient pathway identifier used to associate activity belonging to the same referral-to-treatment pathway."

      - name: referral_to_treatment_status_code
        data_type: varchar
        description: "Referral-to-treatment period status recorded for the attendance."

      - name: referral_to_treatment_period_start_date
        data_type: date
        description: "Start date of the referral-to-treatment period associated with the attendance."

      - name: referral_to_treatment_period_end_date
        data_type: date
        description: "End date of the referral-to-treatment period associated with the attendance."

      - name: waiting_time_measurement_type_code
        data_type: varchar
        description: "Code identifying the waiting-time measurement type for the referral-to-treatment pathway."
