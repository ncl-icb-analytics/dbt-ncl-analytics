
models:
  - name: int_sus_apc_diagnosis
    description: "ICD-10 diagnosis codes associated with SUS admitted patient records.
      For use in secondary care diagnosis table and phenolab"
    config:
      meta:
        owner:
          name: Emily Baldwin
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - visit_occurrence_id
              - source_concept_code
    columns:
      - name: sk_patient_id
        data_type: varchar
        description: "Common commissioning patient identifier"
      
      - name: diagnosis_id
        data_type: number
        description: "Unique ID for each diagnosis code that spell. unlinkable to source table due to deduplication"

      - name: date
        data_type: timestamp_ntz
        description: "Start date of admission spell"

      - name: visit_occurrence_id
        data_type: number
        description: ""

      - name: visit_occurrence_type
        data_type: varchar
        description: ""

      - name: episodes_ids
        data_type: number
        description: "array of episodes ids"

      - name: diagnosis_count
        data_type: number
        description: "Count of the number of occurances of that diagnosis code across all episodes"

      - name: organisation_id
        data_type: varchar
        description: ""

      - name: organisation_name
        data_type: varchar
        description: ""

      - name: site_id
        data_type: varchar
        description: ""

      - name: site_name
        data_type: varchar
        description: ""

      - name: activity_date
        data_type: timestamp_ntz
        description: ""

      - name: source_concept_code
        data_type: varchar
        description: ""

      - name: concept_code
        data_type: varchar
        description: ""

      - name: concept_name
        data_type: varchar
        description: ""

      - name: concept_vocabulary
        data_type: varchar
        description: ""

