version: 2
models:
  - name: int_person_cost_12m
    description: >
      Per-person patient-attributable spend over the latest 12 months. This
      model owns the rolling resource-to-need window over the full-history
      fct_person_cost_by_month fact.
    config:
      meta:
        owner:
          name: Eddie Davison
    columns:
      - name: sk_patient_id
        description: DMIC pseudonymised NHS number (primary key).
        data_tests:
          - not_null
          - unique
      - name: actual_cost_12m
        description: Patient-attributable spend over the latest 12 months (GBP).
        data_tests:
          - not_null
