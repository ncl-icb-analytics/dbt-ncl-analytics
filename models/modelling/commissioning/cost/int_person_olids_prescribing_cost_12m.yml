version: 2
models:
  - name: int_person_olids_prescribing_cost_12m
    description: |
      OLIDS prescribing cost per person (NCL) over the rolling 12-month SLAM
      window, from MEDICATION_ORDER.estimated_cost (EMIS per-order cost
      estimate). Fully populated and validated against EPD - the window
      total agrees with EPD mean-cost-per-item pricing to 0.4%. Covers the
      window months the stalled EPD feed misses; basis is an estimate, not
      reimbursed spend.
    config:
      meta:
        owner:
          name: Eddie Davison
    columns:
      - name: person_id
        description: OLIDS person (primary key).
        data_tests:
          - not_null
          - unique
      - name: prescription_orders_12m
        description: Medication orders in the window.
      - name: orders_costed
        description: Orders with a positive estimated cost (~96%).
      - name: prescribing_cost_12m_modelled
        description: Sum of estimated_cost, GBP.
        data_tests:
          - not_null
