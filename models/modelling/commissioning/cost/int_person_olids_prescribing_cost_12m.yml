version: 2
models:
  - name: int_person_olids_prescribing_cost_12m
    description: |
      OLIDS-modelled prescribing cost per person (NCL) over the rolling
      12-month SLAM window. Each in-window OLIDS medication order is priced
      at the mean EPD actual cost per item for its BNF code (EPD's latest
      12 months; tiered match code -> paragraph -> chapter; one order = one
      item). Modelled basis - covers the window months the stalled EPD feed
      misses, at the cost of pricing precision.
    config:
      meta:
        owner:
          name: Eddie Davison
    columns:
      - name: person_id
        description: OLIDS person (primary key).
        data_tests:
          - not_null
          - unique
      - name: prescription_orders_12m
        description: Medication orders in the window.
      - name: orders_costed
        description: Orders that matched an EPD rate at any BNF tier.
      - name: prescribing_cost_12m_modelled
        description: Modelled prescribing cost, GBP. Unmatched orders carry 0.
        data_tests:
          - not_null
