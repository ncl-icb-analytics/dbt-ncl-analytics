version: 2

models:
  - name: int_sus_apc_spell_monthly
    description: |
      Intermediate-layer APC spell aggregation with all transformations applied.
      
      Grain: One row per spell (aggregated from episode-level source data)
      
      Combines spell demographics, episodes, commissioner attribution, post-processing 
      transformations, business rules application, and SLA classification. Ready for 
      consumption by fact tables.
    
    config:
      meta:
        owner:
          name: Commissioning Analytics
      tags: ['intermediate', 'apc', 'spell', 'commissioning']
    
    columns:
      - name: spell_id
        description: Unique spell identifier (primarykey_id from source)
        data_type: number
        data_tests:
          - unique
          - not_null
      
      - name: sk_patient_id
        description: Pseudonymised NHS Number
        data_type: varchar
        data_tests:
          - not_null
      
      - name: local_patient_identifier
        description: Trust-provided patient identifier
        data_type: varchar
      
      - name: spell_admission_date
        description: Spell start date (patient admission to hospital)
        data_type: timestamp_ntz
        data_tests:
          - not_null
      
      - name: spell_discharge_date
        description: Spell end date (patient discharge from hospital)
        data_type: timestamp_ntz
        data_tests:
          - not_null
      
      - name: length_of_stay_days
        description: Length of spell in days (discharge_date - admission_date)
        data_type: number
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 10000
      
      - name: total_bed_days
        description: Total bed days across all episodes in spell
        data_type: number
      
      - name: episode_count
        description: Number of distinct episodes within the spell
        data_type: number
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 100
      
      - name: zcommissioner_code
        description: |
          Date-effective commissioner code assigned at spell admission via hierarchical lookup:
          1. GP practice (if available)
          2. Patient LSOA
          3. Provider (hosted provider scenario)
          4. Provider postcode (fallback)
        data_type: varchar
        data_tests:
          - not_null
      
      - name: commissioner_lookup_method
        description: Method used to derive commissioner (PRACTICE, LSOA, PROVIDER, PROVIDER_POSTCODE, NOT_FOUND)
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: ['PRACTICE', 'LSOA', 'PROVIDER', 'PROVIDER_POSTCODE', 'NOT_FOUND']
      
      - name: commissioner_lookup_priority
        description: Priority order of lookup method (1=highest, 4=lowest, 99=not found)
        data_type: number
      
      - name: administrative_category
        description: Source administrative category code (01=elective, 02=private, 03/4=non-elective emergency, 05=urgent, 06=transfer)
        data_type: varchar
      
      - name: administrative_category_classification
        description: Classified administrative category (ELECTIVE, PRIVATE, NON_ELECTIVE_EMERGENCY, NON_ELECTIVE_URGENT, NON_ELECTIVE_TRANSFER, UNKNOWN)
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: ['ELECTIVE', 'PRIVATE', 'NON_ELECTIVE_EMERGENCY', 'NON_ELECTIVE_URGENT', 'NON_ELECTIVE_TRANSFER', 'UNKNOWN']
      
      - name: admission_method
        description: Source admission method code (11-13=elective, 21-25/28=emergency, 31-32/81-84=transfer, etc.)
        data_type: varchar
      
      - name: admission_method_classification
        description: Classified admission method (ELECTIVE, EMERGENCY, TRANSFER, OTHER, UNKNOWN)
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: ['ELECTIVE', 'EMERGENCY', 'TRANSFER', 'OTHER', 'UNKNOWN']
      
      - name: admission_source_code
        description: Source of admission (e.g., 49=care home)
        data_type: varchar
      
      - name: discharge_destination
        description: Destination on discharge (e.g., 49=care home)
        data_type: varchar
      
      - name: spell_hrg_code
        description: Healthcare Resource Group code assigned to spell (HRG4+)
        data_type: varchar
      
      - name: sensitive_spell_flag
        description: Flag indicating sensitive admission (1=sensitive, 0=routine). Private patients and flagged spells.
        data_type: number
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
      
      - name: place_of_delivery_derived
        description: Derived place of delivery for maternity spells (null for non-maternity)
        data_type: varchar
      
      - name: care_home_flag
        description: Flag indicating admission from care home (1=from care home, 0=other)
        data_type: number
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
      
      - name: discharged_to_care_home_flag
        description: Flag indicating discharge to care home (1=to care home, 0=other)
        data_type: number
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
      
      - name: spell_tariff_value
        description: Assigned spell tariff value (may vary by HRG, admission type, and LOS)
        data_type: number
      
      - name: dominant_episode_specialty
        description: Main specialty code from dominant episode in spell
        data_type: varchar
      
      - name: dominant_episode_treatment_function
        description: Treatment function code from dominant episode in spell
        data_type: varchar
      
      - name: commissioning_service_agreement_provider
        description: Provider organisation code for the spell
        data_type: varchar
      
      - name: source_extract_type
        description: Extract type from source system (for audit trail)
        data_type: varchar
      
      - name: zdatatype
        description: Data source identifier (always 'SPELL_UNIFIED' for this model)
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: ['SPELL_UNIFIED']
      
      - name: zbusinessrule
        description: Pipe-delimited list of matched business rules that apply to this spell
        data_type: varchar
      
      - name: zcontracttype
        description: SLA contract type classification derived from business rules
        data_type: varchar
      
      - name: model_execution_timestamp
        description: Timestamp when the model was last executed
        data_type: timestamp_ntz
    
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - spell_id
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
      - dbt_utils.expression_is_true:
          arguments:
            expression: "spell_admission_date <= spell_discharge_date"
            name: "admission_before_discharge"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "length_of_stay_days >= 0"
            name: "positive_length_of_stay"
