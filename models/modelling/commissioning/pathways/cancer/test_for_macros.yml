version: 2

models:
  - name: test_for_macros
    description: Test model to verify all ICB shortcut macros are working correctly
    tests:
      - dbt_expectations.expect_table_row_count_to_equal:
          value: 1
    columns:
      - name: wnl_ods_codes
        description: WNL (and historic) ICB codes
      - name: ncl_sub_icb
        description: NCL Sub-ICB code - should be '93C'
      - name: ncl_trust_codes_acute
        description: List of NCL acute trust codes
      - name: ncl_trust_codes_full
        description: Full list of NCL trust codes including non-acute providers
      - name: ncl_borough_names
        description: List of NCL borough names
      - name: ncl_borough_codes
        description: List of NCL borough ONS codes
      - name: nwl_sub_icb
        description: NWL Sub-ICB code - should be 'W2U3Z'
      - name: nwl_trust_codes_acute
        description: List of NWL acute trust codes
      - name: nwl_trust_codes_full
        description: Full list of NWL trust codes including non-acute providers
      - name: nwl_borough_names
        description: List of NWL borough names
      - name: nwl_borough_codes
        description: List of NWL borough ONS codes
